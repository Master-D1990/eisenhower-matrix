async function driveSave(){
  if(!gdriveMode||!gdrive) return;
  if(gdriveSaving){gdriveAgain=true;return;}
  if(!hasDriveAuth()){setDriveStatus('auth');return;}
  gdriveSaving=true; gdriveAgain=false;
  let rev=stateRev;
  gdriveStatusState='saving'; refreshHeader();
  try{
    const meta=await driveMeta(gdrive.fileId);
    let mergedConflicts=null;
    if(meta&&meta.version&&gdrive.version&&meta.version!==gdrive.version){
      const remoteText=await driveRead(gdrive.fileId);
      let merged=null;
      try{
        merged=mergeWithRemote(remoteText);
      }catch(e){
        /* invalid remote file: keep the local version (no confirm in autosave) */
        console.warn('drive merge failed',e);
      }
      if(merged){
        applyRemoteState(merged.state,{dirty:true});
        gdriveMode=true;
        mergedConflicts=merged.conflicts;
        rev=stateRev;
      }
    }
    const stamp=isoNow();
    const text=JSON.stringify({...state,savedAt:stamp});
    const upd=await driveUpdate(gdrive.fileId,text);
    state.savedAt=stamp;
    saveDriveBase(text);
    saveDriveConn({fileId:gdrive.fileId,name:(upd&&upd.name)||gdrive.name,version:(upd&&upd.version)||gdrive.version});
    if(stateRev===rev){dirty=false;setLocalAt(Date.now());saveLocal();}
    else gdriveAgain=true;
    gdriveStatusState='saved';
    if(mergedConflicts!==null) mergedToast(mergedConflicts);
  }catch(e){
    if(e&&e.status===401){clearGdriveToken();gdriveStatusState='auth';}
    else if(e&&e.status===404){
      forgetDrive();
      toast(t('gdriveMissing')+' '+t('gdriveMissingHint'),{label:t('gdriveConnect'),fn:()=>connectDrive()});
      return;
    }else{
      gdriveStatusState='offline'; scheduleDriveRetry();
    }
  }finally{
    gdriveSaving=false;
    refreshHeader();
    if(gdriveAgain&&gdriveMode){gdriveAgain=false;driveSave();}
  }
}
/* fetch changes of other devices: every 15 s while the page is visible, and when it becomes visible again.
   Costs one small metadata request; the file is only downloaded when its version changed. */
const GDRIVE_PULL_MS=15000;
async function drivePull(){
  if(!gdriveMode||!gdrive||gdriveSaving||gdriveSaveTimer||dirty||!hasDriveAuth()) return;
  if(document.visibilityState!=='visible'||gdriveStatusState!=='saved') return;
  if(userBusy()) return;   // try again at the next tick
  gdriveSaving=true;
  const rev=stateRev;
  try{
    const meta=await driveMeta(gdrive.fileId);
    if(meta&&meta.version&&meta.version!==gdrive.version){
      const text=await driveRead(gdrive.fileId);
      if(stateRev!==rev||dirty){gdriveAgain=true;return;}   // edited meanwhile: the next save merges
      const next=parseFileText(text);                         // nothing local pending: remote = merge result
      applyRemoteState(next,{dirty:false});
      gdriveMode=true;
      saveDriveBase(text);
      saveDriveConn({fileId:gdrive.fileId,name:meta.name||gdrive.name,version:meta.version});
      toast(t('gdriveUpdated'));
    }
  }catch(e){
    if(e&&e.status===401){clearGdriveToken();gdriveStatusState='auth';}
    else if(e&&e.status===404){forgetDrive();toast(t('gdriveMissing'));}
  }finally{
    gdriveSaving=false;
    refreshHeader();
    if(gdriveAgain&&gdriveMode){gdriveAgain=false;driveSave();}
  }
}
setInterval(drivePull,GDRIVE_PULL_MS);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')drivePull();});
async function connectDrive(){
  if(!driveAvailable()) return;
  if(!gisLoaded()){loadGis().catch(()=>{});toast(t('gdriveLoading'));return;}
  try{ await getToken(true); }catch(e){ toast(t('gdriveAuthFail')); return; }
  let meta=null;
  try{ meta=await driveFind(); }catch(e){ handleDriveError(e); return; }
  try{
    if(meta){
      const text=await driveRead(meta.id);
      let next=null;
      try{ next=parseFileText(text); }catch(e){ next=null; }
      let same=false;
      if(next){ try{ same=matrixComparable(next)===matrixComparable(state); }catch(e){ same=false; } }
      const conn={fileId:meta.id,name:meta.name||GDRIVE_FILE_NAME,version:meta.version||''};
      if(!same){
        let merged=null;
        if(next){
          try{ merged=mergeStates(loadDriveBaseState(),state,next); }
          catch(err){ console.warn('drive merge failed',err); }
        }
        if(merged){
          saveDriveConn(conn);
          activateDriveMode();
          replaceWithState(merged.state,{dirty:false,handle:null,autoWrite:false});
          gdriveMode=true;
          saveDriveBase(text);
          if(matrixComparable(merged.state)!==matrixComparable(next)){
            const stamp=isoNow();
            const out=JSON.stringify({...merged.state,savedAt:stamp});
            const upd=await driveUpdate(conn.fileId,out);
            state.savedAt=stamp;
            saveDriveBase(out);
            conn.name=(upd&&upd.name)||conn.name;
            conn.version=(upd&&upd.version)||conn.version;
            saveDriveConn(conn);
          }
          dirty=false; lastSaveError=false; setLocalAt(Date.now()); saveLocal();
          setDriveStatus('saved');
          mergedToast(merged.conflicts);
          refreshDriveUi();
          return;
        }
        /* fallback only when the merge itself failed */
        const load=confirm(t('gdriveExistingAsk'));
        if(load){
          if(!next){ try{ next=parseFileText(text); }catch(err){ alert(t('invalidFile')+'\n\n'+err.message); return; } }
          saveDriveConn(conn);
          activateDriveMode();
          replaceWithState(next,{dirty:false,handle:null,autoWrite:false});
          gdriveMode=true;
          saveDriveBase(text);
          setDriveStatus('saved');
          toast(t('gdriveConnected',conn.name));
          return;
        }
      }
      const stamp=isoNow();
      const out=JSON.stringify({...state,savedAt:stamp});
      const upd=await driveUpdate(conn.fileId,out);
      state.savedAt=stamp; dirty=false; lastSaveError=false;
      saveDriveBase(out);
      setLocalAt(Date.now()); saveLocal();
      conn.name=(upd&&upd.name)||conn.name;
      conn.version=(upd&&upd.version)||conn.version;
      saveDriveConn(conn);
      activateDriveMode();
      toast(t('gdriveConnected',conn.name));
    }else{
      const stamp=isoNow();
      const out=JSON.stringify({...state,savedAt:stamp});
      const created=await driveCreate(out);
      state.savedAt=stamp; dirty=false; lastSaveError=false;
      saveDriveBase(out);
      setLocalAt(Date.now()); saveLocal();
      const conn={fileId:created.id,name:created.name||GDRIVE_FILE_NAME,version:created.version||''};
      saveDriveConn(conn);
      activateDriveMode();
      toast(t('gdriveConnected',conn.name));
    }
  }catch(e){ handleDriveError(e); }
}
function handleDriveError(e){
  if(e&&e.status===401){clearGdriveToken();setDriveStatus('auth');if(!gdriveMode)toast(t('gdriveAuthFail'));return;}
  if(e&&e.status===404){forgetDrive();toast(t('gdriveMissing'));return;}
  setDriveStatus('offline');
  if(!gdriveMode)toast(t('gdriveError'));
}
async function continueDrive(){
  if(!gdrive) return;
  if(!hasDriveAuth()&&!gisLoaded()){loadGis().catch(()=>{});toast(t('gdriveLoading'));return;}
  try{ await getToken(true); }catch(e){ toast(t('gdriveAuthFail')); return; }
  let meta;
  try{ meta=await driveMeta(gdrive.fileId); }
  catch(e){
    if(e&&e.status===404){forgetDrive();toast(t('gdriveMissing'));return;}
    if(e&&e.status===401){setDriveStatus('auth');return;}
    toast(t('gdriveError')); return;
  }
  let next=null,remoteText=null;
  try{
    remoteText=await driveRead(gdrive.fileId);
    try{ next=parseFileText(remoteText); }catch(err){ next=null; }
  }catch(e){
    handleDriveError(e); return;
  }
  const remoteVersionDiffers=!!(meta&&meta.version&&gdrive.version&&meta.version!==gdrive.version);
  const remoteAt=next&&next.savedAt?Date.parse(next.savedAt):0;
  const localAt=state.savedAt?Date.parse(state.savedAt):0;
  const remoteNewer=!!next&&(remoteVersionDiffers||remoteAt>localAt);
  const conn={fileId:(meta&&meta.id)||gdrive.fileId,name:(meta&&meta.name)||gdrive.name,version:(meta&&meta.version)||gdrive.version};
  saveDriveConn(conn);
  activateDriveMode();
  let same=false;
  if(next){ try{ same=matrixComparable(next)===matrixComparable(state); }catch(e){ same=false; } }
  if(next&&remoteText&&!same){
    let merged=null;
    try{ merged=mergeStates(loadDriveBaseState(),state,next); }
    catch(err){ console.warn('drive merge failed',err); }
    if(merged){
      applyRemoteState(merged.state,{dirty:true});
      gdriveMode=true;
      saveDriveBase(remoteText);
      if(matrixComparable(merged.state)!==matrixComparable(next)){
        try{
          const stamp=isoNow();
          const out=JSON.stringify({...merged.state,savedAt:stamp});
          const upd=await driveUpdate(gdrive.fileId,out);
          state.savedAt=stamp;
          saveDriveBase(out);
          conn.name=(upd&&upd.name)||conn.name;
          conn.version=(upd&&upd.version)||conn.version;
          saveDriveConn(conn);
          dirty=false; lastSaveError=false; setLocalAt(Date.now()); saveLocal();
        }catch(e){
          gdriveStatusState='offline'; scheduleDriveRetry(); refreshDriveUi();
          return;
        }
      }else{
        dirty=false; setLocalAt(Date.now()); saveLocal();
      }
      setDriveStatus('saved');
      mergedToast(merged.conflicts);
      refreshDriveUi();
      return;
    }
    /* fallback only when the merge itself failed */
    let loadRemote=remoteNewer;
    if(remoteNewer&&dirty) loadRemote=confirm(t('gdriveContinueAsk'));
    if(loadRemote){
      applyRemoteState(next,{dirty:false});
      gdriveMode=true;
      saveDriveBase(remoteText);
      setDriveStatus('saved');
      toast(t('gdriveLoaded'));
    }else{
      setDriveStatus('saved');
      toast(t('gdriveConnected',conn.name));
      if(dirty) scheduleDriveSave(true);
    }
    refreshDriveUi();
    return;
  }
  if(next&&remoteText) saveDriveBase(remoteText);
  setDriveStatus('saved');
  toast(t('gdriveConnected',conn.name));
  if(dirty) scheduleDriveSave(true);
  refreshDriveUi();
}

function dueInfo(due){
  if(!due) return null;
  const [y,m,d]=due.split('-').map(Number);
  const now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const dt=new Date(y,m-1,d);
  const days=Math.round((dt-today)/86400000);
  const short=LANG==='de'?`${d}.${m}.`:`${d} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]}`;
  const full=dt.toLocaleDateString(LANG==='de'?'de-CH':'en-GB',{day:'numeric',month:'long',year:'numeric'});
  let cls='',label=short,extra='';
  if(days<0){cls='overdue';label='! '+short;extra=' · '+t('overdue');}
  else if(days<=2){cls='soon';extra=' · '+t('dueSoon');}
  return {days,short,full,cls,label,title:t('dueTitle')+': '+full+extra};
}
function taskCountText(n){return t('taskCount',n);}
/* canonical data row 0 = top and column 0 = left, both at the highest / lowest end as
   before. Flips only change where a canonical cell is displayed. */
function dispR(r){return state.flipY?state.rows-1-r:r;}
function dispC(c){return state.flipX?state.cols-1-c:c;}
/* coordinates follow the display: A = leftmost displayed column, 1 = top displayed row */
function coordOf(r,c){return colName(dispC(c))+(dispR(r)+1);}
function mixColor(low,high,t){
  const pct=Math.round(clamp(t,0,1)*100);
  return `color-mix(in oklab, ${low} ${100-pct}%, ${high})`;
}
/* rows: least vertical quantity at the bottom to most at the top; the palette
   follows the quantity the axis shows (importance green to red, urgency blue to red) */
function axisColor(quantity,t){
  return quantity==='urgency'?mixColor('var(--urg-low)','var(--urg-high)',t):mixColor('var(--imp-low)','var(--imp-high)',t);
}
function rowColor(r){return axisColor(state.swapped?'urgency':'importance',state.rows<=1?1:1-r/(state.rows-1));}
/* columns: least horizontal quantity on the left to most on the right */
function colColor(c){return axisColor(state.swapped?'importance':'urgency',state.cols<=1?1:c/(state.cols-1));}
function paintCellColors(el,r,c){
  el.style.setProperty('--rc',rowColor(r));
  el.style.setProperty('--cc',colColor(c));
  if(state.rows===1&&state.cols===1) el.style.setProperty('--mix','var(--muted)');
  else if(state.rows===1) el.style.setProperty('--mix','var(--cc)');

}

    const b=$(sel); if(!b||b.hidden) return;
    b.classList.remove('coins-pulse'); void b.offsetWidth; b.classList.add('coins-pulse');
    setTimeout(()=>b.classList.remove('coins-pulse'),650);
  });
}
function coinFloat(amount,rect){
  if(!coinsOn()||!rect) return;
  const el=document.createElement('span');
  el.className='coin-float'; el.textContent=t('coinsGain',amount);
  el.style.left=Math.round(rect.left+rect.width/2)+'px';
  el.style.top=Math.round(rect.top+rect.height/2)+'px';

}
function setTaskCoins(id,value){
  const task=findTask(id); if(!task) return;
  const n=normalizeCoins(value);
  const el=$('#dCoins'); if(el) el.value=String(n);
  if(n===task.coins){refreshDetail(true);return;}
  commit(()=>{task.coins=n;},{detail:true});
  toast(t('coinsValueSet',n));
}
function setCoinsEnabled(v){
  v=!!v; const c=coinsState();

  if(!v){const d=$('#accountDlg'); if(d&&d.open)d.close();}

function renderSettingsCoins(){

      }else{
        const buy=document.createElement('button'); buy.type='button'; buy.className='btn acc-buy'; buy.dataset.buyReward=r.id;
        buy.textContent=r.name+' · '+r.price+' 🪙';
        buy.disabled=c.balance<r.price;
        buy.title=buy.disabled?t('coinsNotEnoughShort'):t('coinsConfirmReward',r.name,r.price);
        const edit=document.createElement('button'); edit.type='button'; edit.className='acc-iconbtn'; edit.dataset.rewardEdit=r.id; edit.textContent='✎'; edit.title=t('coinsEdit'); edit.setAttribute('aria-label',t('coinsEdit'));
        const del=document.createElement('button'); del.type='button'; del.className='acc-iconbtn del'; del.dataset.rewardDelete=r.id; del.textContent='🗑'; del.title=t('coinsDelete'); del.setAttribute('aria-label',t('coinsDelete'));

  }
}
function addRewardFromAccount(){
  const nameEl=$('#accRewardName'), priceEl=$('#accRewardPrice');
  const name=String(nameEl?nameEl.value:'').trim().slice(0,MAX_REWARD_NAME);
  const price=Number(priceEl?priceEl.value:NaN);
  if(!name||!Number.isInteger(price)||price<1||price>MAX_REWARD_PRICE){showAccMsg(t('coinsRewardInvalid'));return;}
  commit(()=>{coinsState().rewards.push({id:uid(),name,price});},{board:false,inbox:false,mobile:false,header:true});
  if(nameEl) nameEl.value=''; if(priceEl) priceEl.value='';
  clearAccMsg(); renderAccount(); toast(t('coinsRewardAdded'));
}
function buyReward(id){
  const c=coinsState(), r=c.rewards.find(x=>x.id===id); if(!r) return;
  if(c.balance<r.price){showAccMsg(t('coinsNotEnough',c.balance));return;}
  if(!confirm(t('coinsConfirmReward',r.name,r.price))) return;
  commit(()=>{c.balance-=r.price;pushCoinLog(-r.price,r.name,null);},{board:false,inbox:false,mobile:false,header:true});
  clearAccMsg(); renderAccount();
}
function saveRewardEdit(id){
  const c=coinsState(), r=c.rewards.find(x=>x.id===id); if(!r) return;
  const nameEl=$('[data-reward-name="'+id+'"]'), priceEl=$('[data-reward-price="'+id+'"]');
  const name=String(nameEl?nameEl.value:'').trim().slice(0,MAX_REWARD_NAME);
  const price=Number(priceEl?priceEl.value:NaN);
  if(!name||!Number.isInteger(price)||price<1||price>MAX_REWARD_PRICE){showAccMsg(t('coinsRewardInvalid'));return;}
  commit(()=>{r.name=name;r.price=price;},{board:false,inbox:false,mobile:false,header:true});
  ui.editReward=null; clearAccMsg(); renderAccount(); toast(t('coinsRewardUpdated'));
}
function deleteReward(id){
  const c=coinsState(), r=c.rewards.find(x=>x.id===id); if(!r) return;
  if(!confirm(t('coinsConfirmDeleteReward',r.name))) return;
  commit(()=>{coinsState().rewards=coinsState().rewards.filter(x=>x.id!==id);},{board:false,inbox:false,mobile:false,header:true});
  if(ui.editReward===id) ui.editReward=null;
  clearAccMsg(); renderAccount(); toast(t('coinsRewardDeleted'));
}
function withdrawCoins(){
  const c=coinsState();
  const amount=Number($('#accAmount')?.value);
  if(!Number.isInteger(amount)||amount<1){showAccMsg(t('coinsInvalidAmount'));return;}
  if(amount>c.balance){showAccMsg(t('coinsNotEnough',c.balance));return;}
  const purpose=String($('#accPurpose')?.value||'').trim().slice(0,MAX_COIN_TEXT)||t('coinsWithdrawDefault');
  commit(()=>{c.balance-=amount;pushCoinLog(-amount,purpose,null);},{board:false,inbox:false,mobile:false,header:true});
  const a=$('#accAmount'),p=$('#accPurpose'); if(a)a.value='';if(p)p.value='';
  clearAccMsg(); renderAccount();
}

/* ---------- task cards ---------- */
function taskCard(task){
  const el=document.createElement('div');
  el.className='task-card'; el.dataset.task=task.id; el.tabIndex=0;
  if(!matchMedia('(max-width:759px)').matches) el.draggable=true;
  const info=dueInfo(task.due);
  const labels=taskLabelObjects(task);
  const parts=[task.title||t('untitled')];
  if(task.desc) parts.push(task.desc);
  if(info) parts.push(info.title);
  if(labels.length) parts.unshift(t('labels')+': '+labels.map(l=>l.name).join(', '));
  el.title=parts.join('\n');
  el.setAttribute('aria-label',(task.title||t('untitled'))+(info?' · '+info.full:'')+(labels.length?' · '+labels.map(l=>l.name).join(', '):''));
  if(labels.length){
    const stripes=document.createElement('span'); stripes.className='card-stripes';
    labels.slice(0,3).forEach(l=>{const s=document.createElement('i');s.style.background=displayLabelColor(l.color);stripes.append(s);});
    el.append(stripes);
    el.style.paddingLeft=(8+5*Math.min(labels.length,3))+'px';
    el.classList.add('has-label'); el.style.setProperty('--lt',displayLabelColor(labels[0].color));
  }
  const title=document.createElement('span'); title.className='task-title'; title.textContent=task.title||t('untitled'); el.append(title);
  const meta=document.createElement('span'); meta.className='task-meta';
  if(task.desc.trim()){const dm=document.createElement('span');dm.className='descmark';dm.textContent='≡';dm.title=t('description');meta.append(dm);}
  if(coinsOn()&&Number.isInteger(task.coins)&&task.coins>0){const cb=document.createElement('span');cb.className='coins-badge';cb.textContent='🪙'+task.coins;cb.title=t('coinsValue')+': '+task.coins;meta.append(cb);}
  if(info){const due=document.createElement('span');due.className='due '+info.cls;due.textContent=info.label;due.title=info.title;meta.append(due);}
  el.append(meta);
  const done=document.createElement('button'); done.className='task-done'; done.type='button'; done.dataset.done=task.id; done.textContent='✓'; done.title=t('done'); done.setAttribute('aria-label',t('done')); el.append(done);
  const q=ui.search.trim().toLowerCase();
  if(q&&!((task.title||'')+'\n'+(task.desc||'')).toLowerCase().includes(q)) el.classList.add('filtered');
  return el;
}

/* ---------- desktop matrix ---------- */
function inlineEdit(el,value,maxLength,apply){
  const input=document.createElement('input');
  input.type='text'; input.className='inline-edit'+(el.className?' '+el.className:''); input.maxLength=maxLength; input.value=value;
  el.replaceWith(input); input.focus(); input.select();
  let finished=false;
  const finish=(save)=>{
    if(finished) return; finished=true;
    const v=input.value, changed=save&&v!==value;
    if(changed) beginEdit();
    input.replaceWith(el); el.textContent=save?v:value;
    if(changed){apply(v);markChanged();}
  };
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();finish(true);}
    else if(e.key==='Escape'){e.preventDefault();finish(false);}
    e.stopPropagation();
  });
  input.addEventListener('blur',()=>finish(true));
}
function labelSpan(text,attrs){
  const span=document.createElement('span'); span.textContent=text;
  if(attrs) Object.entries(attrs).forEach(([k,v])=>span.dataset[k]=v);
  return span;
}
function axisFlipBtn(axis){
  const b=document.createElement('button');
  b.type='button'; b.className='ax-flip-btn'; b.dataset.flipAxis=axis;
  b.textContent=axis==='y'?'⇅':'⇆';
  const name=axis==='y'?state.axisY:state.axisX;
  b.title=t('flipDirT',name); b.setAttribute('aria-label',t('flipDirT',name));
  return b;
}
function renderBoard(){
  const board=$('#board'); if(!board) return;
  inlineAddInput=null;
  board.replaceChildren(); board.className='matrix-grid';
  board.classList.toggle('fx',!!state.flipX);
  board.classList.toggle('fy',!!state.flipY);
  // normal: columns [Y title+arrow | Y levels | cells], rows [cells | X levels | X arrow+title].
  // flipX mirrors the columns, flipY the rows; the origin always sits in the corner where both
  // quantities are lowest and both arrows start exactly there.
  const R=state.rows,C=state.cols,XW=30,AI=5,LW=20;
  const showAxes=!axesHidden;
  const yAx=showAxes&&R>1,xAx=showAxes&&C>1;   // a single-level axis is hidden completely
  const fx=!!state.flipX,fy=!!state.flipY;
  let cols,cellCol,yAxisCol,yLevelsCol;
  if(yAx){
    if(fx){cols=`repeat(${C},minmax(0,1fr)) ${LW}px ${XW}px`;cellCol=1;yLevelsCol=C+1;yAxisCol=C+2;}
    else{cols=`${XW}px ${LW}px repeat(${C},minmax(0,1fr))`;yAxisCol=1;yLevelsCol=2;cellCol=3;}
  }else{cols=`repeat(${C},minmax(0,1fr))`;cellCol=1;}
  let rows,cellRow,xAxisRow,xLevelsRow;
  if(xAx){
    if(fy){rows=`${XW}px ${LW}px repeat(${R},minmax(0,1fr))`;xAxisRow=1;xLevelsRow=2;cellRow=3;}
    else{rows=`repeat(${R},minmax(0,1fr)) ${LW}px ${XW}px`;cellRow=1;xLevelsRow=R+1;xAxisRow=R+2;}
  }else{rows=`repeat(${R},minmax(0,1fr))`;cellRow=1;}
  board.style.gridTemplateColumns=cols;
  board.style.gridTemplateRows=rows;
  const gi=(el,row,col)=>{el.style.gridRow=row;el.style.gridColumn=col;board.append(el);return el;};
  const mk=(cls,kind,index,text,tip)=>{const d=document.createElement('div');d.className=cls;const sp=document.createElement('span');sp.dataset.editLabel=kind;if(index!=null)sp.dataset.index=String(index);sp.textContent=text;sp.title=text+' ('+tip+')';d.append(sp);return d;};
  // titles, centred along their axis, outermost; flip buttons live inside the title track
  if(yAx){
    const d=mk('ax-title y'+(fx?' mirror':''),'axisY',null,state.axisY,t('axisY'));
    if(axisBtns) d.append(axisFlipBtn('y'));
    gi(d,`${cellRow} / span ${R}`,yAxisCol);
  }
  if(xAx){
    const d=mk('ax-title x'+(fy?' top':''),'axisX',null,state.axisX,t('axisX'));
    if(axisBtns) d.append(axisFlipBtn('x'));
    gi(d,xAxisRow,`${cellCol} / span ${C}`);
  }
  // arrows start at the origin corner and end flush with the opposite matrix edge
  if(yAx){
    const ya=document.createElement('div'); ya.className='ax-arrow y '+(fy?'down':'up')+(fx?' mirror':''); ya.style.setProperty('--oy',(xAx?XW-AI:0)+'px');
    if(state.swapped){ya.style.setProperty('--imp-low','var(--urg-low)');ya.style.setProperty('--imp-high','var(--urg-high)');}
    ya.innerHTML='<span class="ln"></span><span class="hd"></span>';
    gi(ya,`1 / span ${xAx?R+2:R}`,yAxisCol);
  }
  if(xAx){
    const xa=document.createElement('div'); xa.className='ax-arrow x '+(fx?'left':'right')+(fy?' top':''); xa.style.setProperty('--ox',(yAx?XW-AI:0)+'px');
    if(state.swapped){xa.style.setProperty('--urg-low','var(--imp-low)');xa.style.setProperty('--urg-high','var(--imp-high)');}
    xa.innerHTML='<span class="ln"></span><span class="hd"></span>';
    gi(xa,xAxisRow,yAx?`1 / span ${C+2}`:`1 / span ${C}`);
  }
  // levels, directly beside their displayed row / column
  if(yAx) for(let r=0;r<R;r++){const d=mk('ax-lev y','row',r,state.rowLabels[r],t('rowLabel'));d.firstChild.style.setProperty('--rc',rowColor(r));gi(d,String(cellRow+dispR(r)),String(yLevelsCol));}
  if(xAx) for(let c=0;c<C;c++){const d=mk('ax-lev x','col',c,state.colLabels[c],t('colLabel'));d.firstChild.style.setProperty('--cc',colColor(c));gi(d,String(xLevelsRow),String(cellCol+dispC(c)));}
  for(let r=0;r<state.rows;r++){
    for(let c=0;c<state.cols;c++) board.append(cellElement(r,c,cellRow,cellCol));
  }
  if(yAx&&xAx&&axisBtns){
    const sw=document.createElement('button');
    sw.type='button'; sw.className='ax-origin-btn'; sw.dataset.swapAxes='1';
    sw.textContent='⇄'; sw.title=t('swapAxesT'); sw.setAttribute('aria-label',t('swapAxesT'));
    board.append(sw);
  }
  updateFades();
  highlightDetailCard();
  scheduleDetailPosition();
  scheduleHeadContrast();
}
function cellElement(r,c,cellRow=1,cellCol=1){
  const key=r+','+c;
  const cell=document.createElement('div'); cell.className='cell'; cell.dataset.r=String(r); cell.dataset.c=String(c); cell.style.gridRow=String(cellRow+dispR(r)); cell.style.gridColumn=String(cellCol+dispC(c));
  paintCellColors(cell,r,c);
  const head=document.createElement('div'); head.className='cell-head'; head.dataset.headR=String(r); head.dataset.headC=String(c);
  const co=document.createElement('span'); co.className='coord'; co.textContent=coordOf(r,c);
  const name=document.createElement('span'); name.className='cell-name'; name.dataset.editCellName='1'; name.dataset.r=String(r); name.dataset.c=String(c); name.textContent=cellNameAt(r,c); name.title=t('cellName');
  if(!cellNameAt(r,c)) name.style.opacity='0.45';
  if(!cellNamesOn){name.textContent='';delete name.dataset.editCellName;name.removeAttribute('title');}
  const count=document.createElement('span'); count.className='cell-count'; const n=visibleTasksIn(r,c).length; count.textContent=String(n); count.title=taskCountText(n);
  const add=document.createElement('button'); add.type='button'; add.className='cell-add'; add.dataset.addCell=key; add.textContent='+'; add.title=t('addTaskT'); add.setAttribute('aria-label',t('addTaskT'));
  head.append(co,name,count,add); cell.append(head);
  const scroll=document.createElement('div'); scroll.className='cell-scroll';
  const list=document.createElement('div'); list.className='cell-list'; list.dataset.cellkey=key;
  const tasks=visibleTasksIn(r,c);
  if(!tasks.length){const empty=document.createElement('div');empty.className='empty-cell';empty.textContent=t('emptyCell');list.append(empty);}
  else tasks.forEach(task=>list.append(taskCard(task)));
  scroll.append(list); cell.append(scroll);
  const fade=document.createElement('div'); fade.className='cell-fade'; cell.append(fade);
  return cell;
}

/* ---------- mobile ---------- */
function matchesSearch(task){
  const q=ui.search.trim().toLowerCase();
  return !q||((task.title||'')+'\n'+(task.desc||'')).toLowerCase().includes(q);
}
function mobileTasks(r,c){
  return (r==null?tasksIn(null,null):tasksIn(r,c)).filter(isTaskVisible).filter(matchesSearch);
}
function dueLevel(tasks){
  let level=0;
  for(const task of tasks){const d=dueInfo(task.due);if(!d)continue;if(d.days<0)return 2;else if(d.days<=2&&level<1)level=1;}
  return level;
}
function mobileSelKey(){return ui.mobileCell?ui.mobileCell.r+','+ui.mobileCell.c:'inbox';}
function saveMobileSelKey(){try{localStorage.setItem('em-mcell',mobileSelKey());}catch(e){}}
function loadMobileSel(){
  let saved=null; try{saved=localStorage.getItem('em-mcell');}catch(e){}
  if(saved==='inbox'){ui.mobileCell=null;return;}
  if(saved&&/^\d+,\d+$/.test(saved)){
    const [r,c]=saved.split(',').map(Number);
    if(r>=0&&r<state.rows&&c>=0&&c<state.cols){ui.mobileCell={r,c};return;}
  }
  ui.mobileCell={r:0,c:state.cols-1};
}
function setMobileSel(key){
  if(key==='inbox') ui.mobileCell=null;
  else{
    const [r,c]=key.split(',').map(Number);
    if(!validCoord([r,c])) return;
    ui.mobileCell={r,c};
  }
  saveMobileSelKey();
  renderMobile();
}
function renderMobileHead(){
  const target=ui.mobileCell;

function renderMobilePad(){

  pad.replaceChildren(); pad.style.setProperty('--mcols',String(state.cols));
  // displayed order; the button still carries the canonical cell key for moves and drops
  for(let dr=0;dr<state.rows;dr++) for(let dc=0;dc<state.cols;dc++){
    const r=dispR(dr),c=dispC(dc);
    const tasks=mobileTasks(r,c);

    pad.append(b);

let taskModSnap=null;   // JSON of every task/archive entry as of the last stamped change
function taskModMap(){
  const m=new Map();
  for(const t of state.tasks||[]) m.set('tasks:'+t.id,JSON.stringify(t));
  for(const a of state.archive||[]) m.set('archive:'+a.id,JSON.stringify(a));
  return m;
}
/* set mod=now on every entry whose content changed or that is new */
function stampTaskMods(prev){
  const now=isoNow();
  const snap=new Map();
  const scan=(place,list)=>{
    for(const e of list||[]){
      const key=place+':'+e.id;
      const before=JSON.stringify(e);
      if(!prev||!prev.has(key)||prev.get(key)!==before) e.mod=now;
      snap.set(key,JSON.stringify(e));
    }
  };
  scan('tasks',state.tasks);
  scan('archive',state.archive);
  taskModSnap=snap;
  return snap;
}
const snapshot=()=>JSON.stringify(state);

/* ---------- resize ---------- */
const mapIndex=(oldIndex,oldN,newN)=>Math.min(newN-1,Math.floor((oldIndex+0.5)*newN/oldN));
/* pure re-mapping of a deep copy; resizeMatrix and mergeStates share this */
function resizeStateCore(st,newRows,newCols,lang){
  newRows=clamp(Math.round(newRows),1,5); newCols=clamp(Math.round(newCols),1,5);
  const oldRows=st.rows,oldCols=st.cols;
  const out=JSON.parse(JSON.stringify(st));
  const oldDef=defaultForLayout(oldRows,oldCols,lang,st.swapped),newDef=defaultForLayout(newRows,newCols,lang,st.swapped);
  const keepRows=!sameArray(st.rowLabels,oldDef.rowLabels);
  const keepCols=!sameArray(st.colLabels,oldDef.colLabels);
  const keepNames=!sameGrid(st.cellNames,oldDef.cellNames);
  const genericR=i=>lang==='de'?(st.swapped?'Dringlichkeit ':'Wichtigkeit ')+(i+1):(st.swapped?'Urgency ':'Importance ')+(i+1);
  const genericC=i=>lang==='de'?(st.swapped?'Wichtigkeit ':'Dringlichkeit ')+(i+1):(st.swapped?'Importance ':'Urgency ')+(i+1);
  out.rowLabels=Array.from({length:newRows},(_,i)=>keepRows?(st.rowLabels[i]??newDef.rowLabels[i]??genericR(i)):newDef.rowLabels[i]);
  out.colLabels=Array.from({length:newCols},(_,i)=>keepCols?(st.colLabels[i]??newDef.colLabels[i]??genericC(i)):newDef.colLabels[i]);
  out.cellNames=Array.from({length:newRows},(_,r)=>Array.from({length:newCols},(_,c)=>keepNames?(st.cellNames[r]?.[c]??newDef.cellNames[r]?.[c]??''):newDef.cellNames[r][c]));
  out.tasks.forEach(task=>{
    if(!task.cell) return;
    const at=Array.isArray(task.at)?task.at:cellCenter(task.cell[0],task.cell[1],oldRows,oldCols);
    if(!Array.isArray(task.at)) task.at=at;
    task.cell=cellFromAt(at,newRows,newCols);
  });
  out.archive.forEach(item=>{
    if(!item.fromCell) return;
    const at=Array.isArray(item.at)?item.at:cellCenter(item.fromCell[0],item.fromCell[1],oldRows,oldCols);
    if(!Array.isArray(item.at)) item.at=at;
    item.fromCell=cellFromAt(at,newRows,newCols);
    if(item.cell) item.cell=cellFromAt(at,newRows,newCols);
  });
  out.rows=newRows; out.cols=newCols;
  return out;
}
function resizeMatrix(newRows,newCols){
  newRows=clamp(Math.round(newRows),1,5); newCols=clamp(Math.round(newCols),1,5);
  if(newRows===state.rows&&newCols===state.cols) return;
  const oldRows=state.rows,oldCols=state.cols;
  const oldMobile=ui.mobileCell;
  leaveExample();
  commit(()=>{
    Object.assign(state,resizeStateCore(state,newRows,newCols,LANG));

/* ---------- swap axes (real transpose of the stored data) ---------- */
/* pure transpose of a deep copy; swapAxes and mergeStates share this */
function transposeStateCore(st){
  const R=st.rows,C=st.cols;
  const out=JSON.parse(JSON.stringify(st));
  out.rows=C; out.cols=R;
  out.rowLabels=st.colLabels.slice().reverse();
  out.colLabels=st.rowLabels.slice().reverse();
  out.cellNames=Array.from({length:C},(_,r)=>Array.from({length:R},(_,c)=>st.cellNames[R-1-c]?.[C-1-r]??''));
  out.axisY=st.axisX; out.axisX=st.axisY;
  transposeEntries(out.tasks,out.archive,R,C);
  out.flipX=!!st.flipY; out.flipY=!!st.flipX;
  out.swapped=!st.swapped;
  return out;
}
function swapAxes(){
  const R=state.rows,C=state.cols;
  const oldMobile=ui.mobileCell;
  leaveExample();
  commit(()=>{
    Object.assign(state,transposeStateCore(state));
    if(oldMobile) ui.mobileCell={r:C-1-oldMobile.c,c:R-1-oldMobile.r};
  },{detail:true,structural:true});

function archiveTask(id){
  const task=findTask(id); if(!task) return;

  const gain=Number.isInteger(task.coins)&&task.coins>0?task.coins:0;

    state.archive.push({id:task.id,title:task.title,desc:task.desc,due:task.due,created:task.created,doneAt:isoNow(),fromCell:task.cell?[task.cell[0],task.cell[1]]:null,at:Array.isArray(task.at)?task.at.slice():null,labels:Array.isArray(task.labels)?task.labels.slice():[],coins:gain});
    if(gain>0){const c=coinsState();c.balance=Math.min(MAX_COIN_BALANCE,c.balance+gain);pushCoinLog(gain,task.title,task.id);}
  },{archive:true,detail:true});

function restoreArchive(id){
  const idx=state.archive.findIndex(x=>x.id===id); if(idx<0) return;
  const item=state.archive[idx];
  const coins=Number.isInteger(item.coins)&&item.coins>0?item.coins:0;

  commit(()=>{
    state.archive.splice(idx,1);

      const c=coinsState();

      c.balance-=taken;

function moveTaskTo(id,cellKey,targetId,after){
  const task=findTask(id); if(!task) return;
  if(targetId===id) return;
  const target=cellKey==='inbox'?null:[Number(cellKey.split(',')[0]),Number(cellKey.split(',')[1])];
  if(target&&!validCoord(target)) return;
  const same=(task.cell===null&&target===null)||(task.cell&&target&&task.cell[0]===target[0]&&task.cell[1]===target[1]);
  if(same&&!targetId) return;
  leaveExample();
  if(!target) ensureInboxOpen();
  commit(()=>{
    const i=state.tasks.findIndex(x=>x.id===id); if(i<0) return;
    state.tasks.splice(i,1);
    task.cell=target;
    if(target) task.at=cellCenter(target[0],target[1],state.rows,state.cols);
    let at=state.tasks.length;
    if(targetId){const ti=state.tasks.findIndex(x=>x.id===targetId);if(ti>=0) at=ti+(after?1:0);}

/* ---------- inline add ---------- */
function cellFromKey(key){return key==='inbox'?null:key.split(',').map(Number);}
function openInlineAdd(key,preventScroll=false){
  if(narrow()) return;
  let list=key==='inbox'?$('#inboxBody .cell-list'):$('#board .cell-list[data-cellkey="'+key+'"]');
  if(!list) return;
  if(inlineAddInput){
    if(inlineAddInput.dataset.cellkey===key){inlineAddInput.focus();return;}
    const old=inlineAddInput;
    inlineAddInput=null;
    old.blur();
    list=key==='inbox'?$('#inboxBody .cell-list'):$('#board .cell-list[data-cellkey="'+key+'"]');
    if(!list) return;
  }
  const input=document.createElement('input');
  input.type='text'; input.className='inline-add'; input.maxLength=MAX_TITLE;
  input.placeholder=t('inlineAddPh'); input.dataset.cellkey=key; input.autocomplete='off'; input.spellcheck=false;
  input.setAttribute('aria-label',t('inlineAddPh'));
  list.prepend(input);
  inlineAddInput=input;
  input.focus({preventScroll});
  let finished=false;
  const finish=(add,reopen)=>{
    if(finished) return;
    const value=input.value;
    if(add&&!value.trim()&&reopen) return;
    finished=true;
    if(inlineAddInput===input) inlineAddInput=null;
    input.remove();
    if(add&&value.trim()){
      addTask(value,cellFromKey(key));
      if(reopen) requestAnimationFrame(()=>openInlineAdd(key,true));
    }
  };
  input.addEventListener('keydown',ev=>{
    if(ev.isComposing) return;
    if(ev.key==='Enter'){ev.preventDefault();ev.stopPropagation();finish(true,true);}
    else if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();finish(false,false);}
    else ev.stopPropagation();
  });
  input.addEventListener('blur',()=>{if(!finished) finish(true,false);});
}
function focusInboxAdd(){
  if(!inboxOn()){
    if(narrow()){ setMobileSel('0,'+(state.cols-1)); openMobileAdd(); return; }
    openInlineAdd('0,'+(state.cols-1)); return;
  }
  if(narrow()){ if(ui.mobileCell!==null) setMobileSel('inbox'); openMobileAdd(); return; }
  if(!ui.inboxOpen) setInboxOpen(true);
  openInlineAdd('inbox');
}

function translateStoredLabels(oldLang,newLang){
  const od=defaultForLayout(state.rows,state.cols,oldLang), nd=defaultForLayout(state.rows,state.cols,newLang);
  let changed=false;
  const oldTitle=oldLang==='de'?'Meine Matrix':'My matrix';
  const newTitle=newLang==='de'?'Meine Matrix':'My matrix';
  if(state.title===oldTitle){state.title=newTitle;changed=true;}
  if(state.axisX===od.axisX){state.axisX=nd.axisX;changed=true;}
  if(state.axisY===od.axisY){state.axisY=nd.axisY;changed=true;}
  state.rowLabels.forEach((v,i)=>{if(v===od.rowLabels[i]){state.rowLabels[i]=nd.rowLabels[i];changed=true;}});
  state.colLabels.forEach((v,i)=>{if(v===od.colLabels[i]){state.colLabels[i]=nd.colLabels[i];changed=true;}});
  state.cellNames.forEach((line,r)=>line.forEach((v,c)=>{if(v===od.cellNames[r][c]){state.cellNames[r][c]=nd.cellNames[r][c];changed=true;}}));
  if(exampleMode){
    const ns=sampleState(newLang);
    if(state.swapped) transposeEntries(ns.tasks,ns.archive,ns.rows,ns.cols);
    state.tasks=ns.tasks; state.archive=ns.archive; state.labels=ns.labels;
    coinsState().rewards=ns.coins.rewards;

  }

}

function applyRemoteState(next,{dirty:newDirty=false}={}){

    }
    let next;
    try{next=parseFileText(text);}catch(err){alert(t('invalidFile')+'\n\n'+err.message);return;}
    replaceWithState(next,{dirty:false,handle,autoWrite:autoSavePref,localAt:fileAt});
    pendingHandle=null; hideContinueBar(); await idbSetHandle(handle);
    toast(t('opened')+': '+(next.title||t('appTitle')));
    return;
  }
  $('#openFile').click();
}
async function ensureWritePermission(handle,request){
  if(!handle.queryPermission) return;
  let p=await handle.queryPermission({mode:'readwrite'});
  if(p!=='granted'&&request&&handle.requestPermission) p=await handle.requestPermission({mode:'readwrite'});
  if(p!=='granted') throw new Error('write permission not granted');
}
async function saveFile(opts={}){
  const asNew=!!opts.asNew, enableAuto=!!opts.enableAuto;
  if(gdriveMode&&!asNew){
    if(!hasDriveAuth()){
      if(!gisLoaded()){loadGis().catch(()=>{});toast(t('gdriveLoading'));return;}
      try{ await getToken(true); }catch(e){ toast(t('gdriveAuthFail')); return; }
    }
    await driveSave();
    return;
  }
  if(asNew) leaveDriveMode();
  const stamp=isoNow();
  const data=JSON.stringify({...state,savedAt:stamp});
  if(window.showSaveFilePicker){
    try{
      if(!fileHandle||asNew){
        const h=await showSaveFilePicker({suggestedName:fileName('.matrix.json'),types:pickerTypes()});
        if(asNew||!fileHandle) fileHandle=h;
      }
      await ensureWritePermission(fileHandle,true);
      const w=await fileHandle.createWritable(); await w.write(data); await w.close();
      state.savedAt=stamp;
      dirty=false; lastSaveError=false; stateRev++;
      if(enableAuto){setAutoSavePref(true);autoWrite=true;}
      setLocalAt(Date.now()); saveLocal();
      await idbSetHandle(fileHandle); pendingHandle=null; hideContinueBar();
      refreshHeader();
      toast(enableAuto||autoWrite?t('savedShort'):t('saved')+fileHandle.name);
    }catch(err){
      if(err&&err.name==='AbortError') return;
      console.warn(err);
      if(fileHandle) lastSaveError=true;
      refreshHeader(); toast(t('saveFail'));
    }
    return;
  }
  downloadBlob(new Blob([data],{type:'application/json'}),fileName('.matrix.json'));
  state.savedAt=stamp; dirty=false; lastSaveError=false; setLocalAt(Date.now()); saveLocal(); refreshHeader(); toast(t('downloaded')+fileName('.matrix.json'));
}
async function saveFileAs(){ return saveFile({asNew:true}); }
async function toggleAutoSave(){
  if(gdriveMode) return;
  if(!autoSaveSupported()) return;
  if(autoWrite){
    autoWrite=false; lastSaveError=false; setAutoSavePref(false); refreshHeader(); return;
  }
  if(!fileHandle){
    try{
      fileHandle=await showSaveFilePicker({suggestedName:fileName('.matrix.json'),types:pickerTypes()});
    }catch(err){
      if(err&&err.name!=='AbortError') toast(t('saveFail'));
      return;
    }
    await idbSetHandle(fileHandle); pendingHandle=null; hideContinueBar();
    setAutoSavePref(true); autoWrite=true; dirty=true;
    await writeCurrentFile(true);
    refreshHeader();
    return;
  }
  try{
    await ensureWritePermission(fileHandle,true);
  }catch(err){
    lastSaveError=true; refreshHeader(); return;
  }
  setAutoSavePref(true); autoWrite=true; refreshHeader();
  if(dirty) scheduleFileWrite();
}
async function retrySave(){
  if(!fileHandle) return;
  try{
    await ensureWritePermission(fileHandle,true);
  }catch(err){
    lastSaveError=true; refreshHeader(); return;
  }
  autoWrite=autoSavePref;
  if(dirty||lastSaveError) await writeCurrentFile(true);
  else{lastSaveError=false;refreshHeader();}
}
/* discrete actions write immediately; text typing is debounced to 500 ms */
function scheduleFileWrite(immediate=true){
  if(gdriveMode){ scheduleDriveSave(immediate); return; }
  if(!autoWrite||!fileHandle) return;
  if(immediate){ clearTimeout(fileTimer); fileTimer=null; writeCurrentFile(); }
  else{
    clearTimeout(fileTimer);
    fileTimer=setTimeout(()=>{fileTimer=null;writeCurrentFile();},500);
  }
}
function flushFileWrite(){
  if(gdriveMode){
    if(gdriveSaveTimer!==null){clearTimeout(gdriveSaveTimer);gdriveSaveTimer=null;}
    if(dirty||gdriveStatusState==='saving'||gdriveStatusState==='offline'||gdriveStatusState==='auth') driveSave();
    return;
  }
  if(fileTimer!==null){clearTimeout(fileTimer);fileTimer=null;}
  if(autoWrite&&fileHandle) writeCurrentFile();
}
async function writeCurrentFile(requestPermission=false){
  if(!autoWrite||!fileHandle||writingFile){if(writingFile)writeAgain=true;return;}
  writingFile=true; writeAgain=false;
  const rev=stateRev, stamp=isoNow(), data=JSON.stringify({...state,savedAt:stamp});
  try{
    await ensureWritePermission(fileHandle,requestPermission);
    const w=await fileHandle.createWritable(); await w.write(data); await w.close();
    lastSaveError=false; state.savedAt=stamp;
    if(stateRev===rev){dirty=false;setLocalAt(Date.now());saveLocal();}
    else writeAgain=true;
  }catch(err){
    console.warn(err);
    if(!lastSaveError){toast(t('saveFail'));lastSaveError=true;}
  }finally{
    writingFile=false;
    refreshHeader();
    if(writeAgain&&autoWrite){writeAgain=false;writeCurrentFile();}
  }
}

async function continueWithStored(){
  const h=pendingHandle; if(!h) return;
  try{
    let p=h.queryPermission?await h.queryPermission({mode:'readwrite'}):'granted';
    if(p!=='granted'&&h.requestPermission) p=await h.requestPermission({mode:'readwrite'});
    if(p!=='granted'){toast(t('permissionDenied'));return;}
    const file=await h.getFile();
    const text=await file.text();
    const fileAt=file.lastModified||0;
    const stateAt=state.savedAt?Date.parse(state.savedAt):0;
    if(getLocalAt()>fileAt+2000||stateAt>fileAt+2000){
      const keepLocal=confirm(t('localNewer'));
      if(keepLocal){
        fileHandle=h; autoWrite=autoSavePref; pendingHandle=null; hideContinueBar();
        await idbSetHandle(h);
        dirty=true; setLocalAt(Date.now()); saveLocal(); renderAllDynamic(); refreshHeader();
        if(autoWrite) scheduleFileWrite();
        toast(t('keptLocal')); return;
      }
    }
    let next;
    try{next=parseFileText(text);}catch(err){alert(t('invalidFile')+'\n\n'+err.message);return;}
    replaceWithState(next,{dirty:false,handle:h,autoWrite:autoSavePref,localAt:fileAt});
    pendingHandle=null; hideContinueBar(); await idbSetHandle(h);
    toast(t('opened')+': '+(next.title||t('appTitle')));
  }catch(err){
    console.warn(err); toast(t('openFail'));
  }
}
async function restoreStoredHandle(){
  if(!autoSaveSupported()) return;
  const h=await idbGetHandle();
  if(!h||!h.name) return;
  pendingHandle=h;
  // Chrome keeps the permission when the user chose "allow on every visit" (or for an installed app):
  // then continue with the file right away, otherwise ask with one click
  let p='prompt';
  try{if(h.queryPermission) p=await h.queryPermission({mode:'readwrite'});}catch(e){}
  if(p==='granted'){await continueWithStored();if(!pendingHandle)return;}
  showContinueBar(h.name);
}

/* ---------- CSV ---------- */
function csvCell(v){
  let s=String(v??'');
  if(/^[=+\-@\t\r]/.test(s)) s="'"+s;
  return /[";\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function exportCsv(){
  const showCoins=coinsOn();
  const head=[t('csvStatus'),t('csvCell'),t('csvCellName'),t('csvTitle'),t('csvDesc'),t('csvLabels')];
  if(showCoins) head.push(t('csvCoins'));
  head.push(t('csvDue'),t('csvCreated'),t('csvDone'));
  const rows=[head];
  for(const task of state.tasks){
    const co=task.cell?coordOf(task.cell[0],task.cell[1]):t('inboxOption');
    const name=task.cell?cellNameAt(task.cell[0],task.cell[1]):t('inboxOption');
    const row=[t('csvOpen'),co,name,task.title,task.desc,labelNames(task).join(', ')];
    if(showCoins) row.push(task.coins||0);
    row.push(task.due||'',task.created,'');
    rows.push(row);
  }
  for(const item of state.archive){
    const co=validCoord(item.fromCell)?coordOf(item.fromCell[0],item.fromCell[1]):t('inboxOption');
    const name=validCoord(item.fromCell)?cellNameAt(item.fromCell[0],item.fromCell[1]):t('inboxOption');
    const row=[t('csvDoneStatus'),co,name,item.title,item.desc,labelNames(item).join(', ')];
    if(showCoins) row.push(item.coins||0);
    row.push(item.due||'',item.created,item.doneAt);
    rows.push(row);
  }
  const text='﻿'+rows.map(row=>row.map(csvCell).join(';')).join('\r\n');
  const name=fileName('.csv');
  downloadBlob(new Blob([text],{type:'text/csv;charset=utf-8'}),name);
  toast(t('downloaded')+name);
}

let touchOp=null;
function clearPadHover(){$$('#mobilePad .drop-hover,#mobileInboxBtn.drop-hover').forEach(el=>el.classList.remove('drop-hover'));}
function cleanupTouchOp(){
  if(!touchOp) return;
  clearTimeout(touchOp.timer);
  if(touchOp.ghost) touchOp.ghost.remove();
  if(touchOp.card) touchOp.card.classList.remove('drag-src','swiping');
  if(touchOp.reveal) touchOp.reveal.remove();
  clearPadHover();
  touchOp=null;
}
function beginLongPressDrag(){
  if(!touchOp||touchOp.mode!=='press') return;
  const t=touchOp; t.mode='drag'; t.timer=null;
  const rect=t.card.getBoundingClientRect();
  const ghost=t.card.cloneNode(true);
  ghost.classList.remove('drag-src'); ghost.classList.add('drag-ghost');
  ghost.style.left=rect.left+'px'; ghost.style.top=rect.top+'px';
  ghost.style.width=rect.width+'px'; ghost.style.height=rect.height+'px';
  document.body.append(ghost);
  t.ghost=ghost; t.card.classList.add('drag-src');
  try{t.card.setPointerCapture(t.pointerId);}catch(e){}
  if(navigator.vibrate) {try{navigator.vibrate(12);}catch(e){}}
}
function startSwipe(t){
  t.mode='swipe';
  const wrap=t.card.parentElement;
  const reveal=document.createElement('div'); reveal.className='swipe-reveal'; reveal.textContent='✓';
  reveal.style.left=t.card.offsetLeft+'px'; reveal.style.top=t.card.offsetTop+'px';
  reveal.style.width=t.card.offsetWidth+'px'; reveal.style.height=t.card.offsetHeight+'px';
  wrap.insertBefore(reveal,t.card);
  t.reveal=reveal; t.card.classList.add('swiping'); t.card.style.transition='none';
}
document.addEventListener('pointerdown',e=>{
  if(!narrow()||e.pointerType==='mouse') return;
  const card=e.target.closest('#mobileCellList .task-card'); if(!card||e.target.closest('[data-done]')) return;
  if(e.button!==undefined&&e.button!==0) return;
  cleanupTouchOp();
  touchOp={id:card.dataset.task,card,pointerId:e.pointerId,sx:e.clientX,sy:e.clientY,mode:'press',timer:null,ghost:null,reveal:null};
  touchOp.timer=setTimeout(beginLongPressDrag,400);
});
document.addEventListener('pointermove',e=>{
  if(!touchOp||e.pointerId!==touchOp.pointerId) return;
  const t=touchOp, dx=e.clientX-t.sx, dy=e.clientY-t.sy;
  if(t.mode==='press'){
    if(Math.hypot(dx,dy)>8){
      clearTimeout(t.timer); t.timer=null;
      if(dx>10&&Math.abs(dx)>Math.abs(dy)*1.15) startSwipe(t);
      else {touchOp=null;}
    }
    return;
  }
  if(t.mode==='drag'){
    if(t.ghost) t.ghost.style.transform=`translate(${dx}px,${dy}px) rotate(1.5deg)`;
    clearPadHover();
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const pad=el&&el.closest('[data-pad-cell]');
    if(pad) pad.classList.add('drop-hover');
    return;
  }
  if(t.mode==='swipe'){
    const w=t.card.getBoundingClientRect().width;
    const move=clamp(dx,0,w*1.05);
    t.card.style.transform='translateX('+move+'px)';
    if(t.reveal) t.reveal.classList.toggle('armed',move>w*0.35);
  }
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(touchOp&&(touchOp.mode==='drag'||touchOp.mode==='swipe')) e.preventDefault();
},{passive:false});
document.addEventListener('pointerup',e=>{
  if(!touchOp||e.pointerId!==touchOp.pointerId) return;
  const op=touchOp;
  if(op.mode==='drag'){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const pad=el&&el.closest('[data-pad-cell]');
    const key=pad?pad.dataset.padCell:null;
    cleanupTouchOp();
    ui.longPressGuard=Date.now()+700;
    if(key){moveByIdToCell(op.id,key);toast(t('moved'));}
    return;
  }
  if(op.mode==='swipe'){
    const w=op.card.getBoundingClientRect().width;
    const dx=e.clientX-op.sx;
    const armed=dx>w*0.35;
    op.card.style.transition='transform .18s';
    op.card.style.transform='';
    const card=op.card, reveal=op.reveal;
    setTimeout(()=>{card.style.transition='';},200);
    clearTimeout(op.timer);
    if(reveal) reveal.remove();
    op.reveal=null; op.card.classList.remove('swiping');
    touchOp=null;
    ui.longPressGuard=Date.now()+700;
    if(armed) archiveTask(op.id);
    return;
  }
  cleanupTouchOp();
});

/* drag and drop */
let dragTaskId=null,dropInfo=null;
function clearDropMarks(){$$('.drop-before,.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'));$$('.cell-list.drop-empty').forEach(el=>el.classList.remove('drop-empty'));$('#dropDone').classList.remove('over');}
function finishDrag(){dragTaskId=null;dropInfo=null;clearDropMarks();document.body.classList.remove('dragging');$$('.task-card.dragging').forEach(el=>el.classList.remove('dragging'));}
document.addEventListener('dragstart',e=>{
  const card=e.target.closest('.task-card'); if(!card||narrow()) return;
  dragTaskId=card.dataset.task; card.classList.add('dragging'); document.body.classList.add('dragging');
  try{e.dataTransfer.setData('text/plain',dragTaskId);e.dataTransfer.effectAllowed='move';e.dataTransfer.setDragImage(card,12,17);}catch(err){}
});
document.addEventListener('dragend',finishDrag);
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)clearDropMarks();});
document.addEventListener('dragover',e=>{
  if(!dragTaskId) return;
  const bar=e.target.closest&&e.target.closest('#dropDone');
  if(bar){e.preventDefault();e.dataTransfer.dropEffect='move';clearDropMarks();bar.classList.add('over');dropInfo={done:true};return;}
  const el=e.target.closest?e.target:e.target.parentElement;
  const list=el.closest('.cell-list')||el.closest('.cell')?.querySelector('.cell-list')||el.closest('#inbox')?.querySelector('.cell-list');
  if(!list) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move'; clearDropMarks();
  const cards=$$('.task-card:not(.dragging):not(.filtered)',list);
  let targetId=null,after=false;
  for(const card of cards){
    const r=card.getBoundingClientRect();
    if(e.clientY<r.top+r.height/2){targetId=card.dataset.task;after=false;break;}
    targetId=card.dataset.task;after=true;
  }
  dropInfo={cellKey:list.dataset.cellkey,targetId,after};
  if(targetId)document.querySelector(`.task-card[data-task="${targetId}"]`)?.classList.add(after?'drop-after':'drop-before');
  else list.classList.add('drop-empty');
});
document.addEventListener('drop',e=>{
  if(!dragTaskId) return;
  e.preventDefault();
  if(e.target.closest('#dropDone')){const id=dragTaskId;finishDrag();archiveTask(id);return;}
  const info=dropInfo; const id=dragTaskId;
  finishDrag();
  if(info&&!info.done&&info.cellKey) moveTaskTo(id,info.cellKey,info.targetId,info.after);
});

/* first start */
function init(){
  let restored=false;
  try{
    const raw=localStorage.getItem('em-state');
    if(raw){state=validateState(JSON.parse(raw));migrateColLabels(state);restored=true;}
  }catch(e){restored=false;}
  if(!restored) state=sampleState();
  let wasExample=false;
  try{wasExample=localStorage.getItem('em-example')==='1';}catch(e){}
  setExampleMode(!restored||wasExample);
  dirty=false; fileHandle=null; autoWrite=false;
  if(!Array.isArray(state.labels)) state.labels=[];
  ui.mobileCell=null; ui.detailId=null; ui.archiveOpen=false; ui.search=''; ui.archiveQuery='';
  ui.inboxOpen=initialInboxOpen();
  loadAxesHidden(); loadAxisBtns(); loadCellNames(); loadTaskFont(); loadTint();
  loadFilter(); loadMobileSel(); resetHistory(); validateUi(); applyStatic(); renderAllDynamic();
  saveLocal(true);
  gdrive=driveAvailable()?loadDriveConn():null;
  gdriveMode=false; gdriveContinue=false; gdriveStatusState='saved';
  if(driveAvailable()&&gdrive){
    loadGis().catch(()=>{});
    showDriveContinueBar();
    loadGdriveToken();
    if(hasDriveAuth()) continueDrive();   // still signed in (or lasting connection): continue without a click
  }else{
    restoreStoredHandle();
  }
  refreshDriveUi();
  let seen=false; try{seen=!!localStorage.getItem('em-seen');}catch(e){}
  let nohelp=false; try{nohelp=new URLSearchParams(location.search).has('nohelp');}catch(e){}
  if(!seen&&!nohelp) openHelp();
  requestAnimationFrame(updateFades);
}
/* favicon: always 3x3 in the brand colours, oriented like the matrix (hot corner where the matrix has it) */
// FAV[i][u]: importance level i and urgency level u, 0 = lowest, 2 = highest
const FAV=[['#0097b5','#708d79','#b5791c'],['#6d7fad','#ad6f70','#e24b00'],['#a95fa3','#da3b66','#d93b3b']];
let favKey='';
function updateFavicon(){
  const key=[!!state.swapped,!!state.flipX,!!state.flipY].join();
  if(key===favKey) return; favKey=key;
  let rects='';
  for(let y=0;y<3;y++) for(let x=0;x<3;x++){
    // vertical level (2 = top) and horizontal level (2 = right) in the normal orientation, then flips
    const v=state.flipY?y:2-y, h=state.flipX?2-x:x;
    const imp=state.swapped?h:v, urg=state.swapped?v:h;
    rects+=`<rect x="${4+x*20}" y="${4+y*20}" width="16" height="16" rx="3.5" fill="${FAV[imp][urg]}"/>`;
  }
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">${rects}</svg>`;
  const link=document.getElementById('favicon'); if(link) link.href='data:image/svg+xml,'+encodeURIComponent(svg);
  // the PNG variant too (browsers without SVG favicons, or ones preferring the PNG)
  try{
    const cv=document.createElement('canvas'); cv.width=cv.height=96; const g=cv.getContext('2d'); const k=96/64;
    for(const m of rects.matchAll(/x="(\d+)" y="(\d+)"[^>]*fill="(#[0-9a-f]{6})"/g)){
      g.fillStyle=m[3]; g.beginPath(); g.roundRect(m[1]*k,m[2]*k,16*k,16*k,3.5*k); g.fill();
    }
    const png=document.getElementById('faviconPng'); if(png) png.href=cv.toDataURL('image/png');
  }catch(e){}
}
