<style>
:root{
  --bg:#f3f4f7; --panel:#fff; --line:#d8dbe1; --text:#1d2330; --muted:#6b7280; --accent:#2f6fed;
  --g:#2e9e4f; --y:#e0a800; --r:#d64545; --orange:#c97a00;
  --field:#fff; --hover:#f0f2f5; --soft:#f7f8fa; --faint:#9aa1ad; --ph:#b0b6c2;
  --empty:#e1e4ea; --accent-soft:#eef3ff; --ring:#c9d8fb; --danger-line:#f0c4c4;
  --ok:#2e9e4f; --shadow:0 8px 28px rgba(20,28,45,.16);
  --coin-bg:#fff4cc; --coin-line:#e3bd54; --coin-ink:#7a5200; --coin-solid:#c9971d;
  --imp-low:#2e9d57; --imp-high:#d93b3b; --urg-low:#2f6fd6; --urg-high:#d93b3b;
  --tint-cell:5%; --tint-head:26%; --tint-label:14%; --tint-tile:8%;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

}}
:root[data-theme="dark"]{
  --bg:#14161b; --panel:#1c1f26; --line:#363b46; --text:#e6e8ec; --muted:#9aa1ad; --accent:#5b8cff;
  --g:#3fb565; --y:#e6b422; --r:#e5605f; --orange:#e0a04a;

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{font:inherit}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:12px} .spacer{flex:1}
[hidden]{display:none!important}

/* Header */
#bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:7px;align-items:center;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;min-width:0}
.hbar{display:flex;align-items:center;gap:7px;min-width:0}
.hbar-main{flex:0 1 auto;min-width:0}
.hbar-tools{flex:0 1 auto;min-width:0}
#ptitle{font-weight:650;font-size:17px;border:1px solid transparent;border-radius:6px;padding:4px 7px;min-width:120px;flex:0 1 240px;text-overflow:ellipsis;background:transparent}
#ptitle:hover,#ptitle:focus{border-color:var(--line);background:var(--field);outline:none}
.save-group{display:inline-flex;align-items:center;gap:4px;min-width:0;flex:0 1 auto;position:relative}
.auto-switch{display:inline-flex;flex-direction:row-reverse;align-items:center;gap:.45em;border:1px solid var(--line);background:var(--field);border-radius:6px;padding:4px 8px 4px 10px;font-size:13px;line-height:1.2;cursor:pointer;color:var(--text);flex:0 0 auto;white-space:nowrap}
.auto-switch .sw{width:1.86em;height:1em;border-radius:.5em;background:var(--empty);position:relative;transition:background .2s;flex:0 0 auto}
.auto-switch .sw::after{content:"";position:absolute;left:.14em;top:.14em;width:.72em;height:.72em;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.auto-switch[aria-checked="true"] .sw{background:var(--accent)}
.auto-switch[aria-checked="true"] .sw::after{transform:translateX(.86em)}
.auto-switch:disabled{opacity:.42;cursor:default}
#fileStatus{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:3px 9px;font-size:12px;line-height:1.3;cursor:pointer;white-space:nowrap;max-width:260px;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;color:var(--muted);text-align:left}
#fileStatus:hover{background:var(--hover)}
#fileStatus.ok{color:var(--ok);border-color:color-mix(in oklab,var(--ok) 40%,var(--line))}
#fileStatus.warn{color:var(--orange);border-color:color-mix(in oklab,var(--orange) 45%,var(--line))}
#fileStatus.err{color:var(--r);border-color:color-mix(in oklab,var(--r) 52%,var(--line))}
.save-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:130;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:9px;min-width:255px;max-width:300px;display:flex;flex-direction:column;gap:6px}
.save-pop .sp-file{font-size:12.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save-pop .sp-time{font-size:11.5px;color:var(--muted)}
.save-pop .sp-auto{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0;margin:1px 0}
.save-pop .btn{font-size:12.5px;padding:5px 8px}
.btn{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap;color:var(--text)}
a.btn{color:var(--text);text-decoration:none;display:inline-block}
.btn:hover{background:var(--hover)}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.btn:disabled{opacity:.35;cursor:default}
.btn.small{padding:3px 8px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.needs-save{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.danger{color:var(--r);border-color:var(--danger-line)}
.btn.danger:hover{background:color-mix(in srgb,var(--r) 10%,var(--panel))}
.btn.iconbtn{padding:5px 8px;min-width:32px}
.btn.tgl{padding-left:34px;position:relative}
.btn.tgl::before{content:"";position:absolute;left:8px;top:50%;width:20px;height:12px;margin-top:-6px;border-radius:6px;background:var(--empty);transition:background .2s}
.btn.tgl::after{content:"";position:absolute;left:10px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.btn.tgl[aria-pressed="true"]::before{background:var(--accent)}
.btn.tgl[aria-pressed="true"]::after{transform:translateX(8px)}
.sep{width:1px;height:24px;background:var(--line);margin:0 2px;flex:0 0 auto}
select{border:1px solid var(--line);border-radius:6px;padding:3px 5px;background:var(--field);color:var(--text)}
.size{display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:12px;color:var(--muted)}
.size select{padding:3px 2px}
.searchbox{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:0 6px;min-width:110px;flex:1 1 140px;max-width:210px}
.searchbox svg{width:15px;height:15px;color:var(--faint);flex:0 0 auto}
.searchbox input{border:0;background:transparent;padding:5px 0;min-width:0;width:100%;outline:none}
#archiveBtn{display:inline-flex;align-items:center;gap:5px}
#archiveCount{font-size:11px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--ring);border-radius:999px;min-width:19px;padding:0 5px;line-height:17px;text-align:center}
.coins-btn,.coins-pill{display:inline-flex;align-items:center;gap:3px;background:var(--coin-bg);border:1px solid var(--coin-line);color:var(--coin-ink);font-weight:700;border-radius:999px;white-space:nowrap;cursor:pointer;flex:0 0 auto}
.coins-btn{padding:3px 9px;font-size:13px}
.coins-pill{padding:2px 7px;font-size:12px;line-height:1.25}
.coins-btn:hover,.coins-pill:hover{background:color-mix(in srgb,var(--coin-solid) 22%,var(--coin-bg))}
.coins-pulse{animation:coinsPulse .6s ease-out}
@keyframes coinsPulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:var(--field);padding:5px 7px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--text);font-weight:600}
.seg svg{width:15px;height:15px;display:block}
#helpBtn{font-weight:600}
#settingsBtn{display:inline-flex;align-items:center;gap:3px}
#settingsBtn .set-gear{font-size:14px;line-height:1}
#settingsBtn .set-label{white-space:nowrap}
@media screen and (max-width:1239px){#settingsBtn .set-label{display:none}}
#mobileMenu{display:none}

/* Menus */
.menu{position:relative;display:inline-block;flex:0 0 auto}
.menu>.btn::after{content:" ▾";font-size:10px;color:var(--muted)}
.menu-list{position:absolute;top:calc(100% + 5px);left:0;min-width:235px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;z-index:120}
.menu-list.right{left:auto;right:0}
.menu-list button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:7px 9px;border-radius:5px;cursor:pointer;white-space:nowrap;font-size:14px}
.menu-list button:hover,.menu-list button:focus-visible{background:var(--hover);outline:none}
.menu-list button.chk{padding-left:27px;position:relative}
.menu-list .tick{position:absolute;left:9px;color:var(--accent);font-weight:700}
.menu-list button small{display:block;font-size:11.5px;color:var(--muted);white-space:normal}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu-list .menulabel{padding:6px 9px 2px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.menu-size{display:flex;gap:6px;align-items:center;padding:5px 9px 8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.menu-size select{flex:1;min-width:58px}
.menu-size .size-x{flex:0 0 auto}
.menu-list .size-opt{padding-left:27px;position:relative}
.menu-list .size-opt .size-main{font-size:14px}
.menu-list .size-opt small{display:block;font-size:11px;color:var(--muted);white-space:normal;font-weight:400}
.menu-list .size-opt .tick{position:absolute;left:9px;top:7px;color:var(--accent);font-weight:700}
.size-custom-label{padding:6px 9px 0;font-size:11px;font-weight:600;color:var(--muted)}
#sizeMenuList{min-width:292px}
#sizeMenuList .menu-size{flex-wrap:nowrap}
#sizeMenuList .menu-size>span{white-space:nowrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(18px);background:var(--text);color:var(--bg);padding:8px 15px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}

/* Desktop board */
#main{flex:1;display:flex;min-height:0;min-width:0;position:relative}
#board{flex:1;min-width:0;min-height:0}
.matrix-grid{display:grid;gap:7px;padding:10px 10px 8px 8px;height:100%;min-height:0;min-width:0;position:relative}
/* chart axes: [title | arrow | levels | cells] normally, mirrored when flipX / flipY.
   Both arrows start at the common origin corner (bottom left, bottom right, top left or
   top right) and their heads end flush with the opposite matrix edge. */
.ax-title{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;position:relative;container-type:size}
.ax-title span{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;cursor:text;letter-spacing:.02em;line-height:1.05}
.ax-title.y span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:clamp(12px,6cqh,16px)}
/* vertical title reads bottom to top, so its button comes after it: above */
.ax-title.y{flex-direction:column-reverse;justify-content:center;align-items:flex-start;gap:4px;padding:0 0 0 2px}
.ax-title.y:has(.ax-flip-btn){padding-bottom:25px}
.ax-title.y.mirror{align-items:flex-end;padding:0 2px 0 0}
.ax-title.y.mirror:has(.ax-flip-btn){padding-bottom:25px}
.ax-title.x{align-items:flex-start;padding-top:11px;gap:6px}
.ax-title.x.top{padding-top:2px}
.ax-title.x span{font-size:clamp(12px,3cqw,16px)}
.ax-flip-btn{position:absolute;width:21px;height:21px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12px;line-height:1;cursor:pointer;z-index:4;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ax-flip-btn:hover{background:var(--hover);color:var(--text);border-color:var(--faint)}
.ax-title.y .ax-flip-btn{position:static;flex:0 0 auto}
.ax-title.x .ax-flip-btn{position:static;flex:0 0 auto;align-self:flex-end;margin-bottom:0}
.ax-title.x.top .ax-flip-btn{align-self:flex-start;margin-top:0}
.ax-arrow{position:relative;min-width:0;min-height:0;pointer-events:none}
.ax-arrow .ln{position:absolute;border-radius:2px}
.ax-arrow .hd{position:absolute;width:12px;height:12px}
.ax-arrow.y .ln{left:calc(100% - 5px);width:3px;margin-left:-1.5px;top:9px;bottom:var(--oy,8px);background:linear-gradient(to top,var(--imp-low),var(--imp-high))}
.ax-arrow.y .hd{left:calc(100% - 5px);margin-left:-6px;top:0;background:var(--imp-high);clip-path:polygon(50% 0,100% 100%,0 100%)}
.ax-arrow.y.mirror .ln,.ax-arrow.y.mirror .hd{left:5px}
.ax-arrow.y.down .ln{top:var(--oy,8px);bottom:9px;background:linear-gradient(to bottom,var(--imp-low),var(--imp-high))}
.ax-arrow.y.down .hd{top:auto;bottom:0;clip-path:polygon(0 0,100% 0,50% 100%)}
.ax-arrow.x .ln{top:5px;height:3px;margin-top:-1.5px;left:var(--ox,8px);right:9px;background:linear-gradient(to right,var(--urg-low),var(--urg-high))}
.ax-arrow.x .hd{top:5px;margin-top:-6px;right:0;background:var(--urg-high);clip-path:polygon(0 0,100% 50%,0 100%)}
.ax-arrow.x.left .ln{left:9px;right:var(--ox,8px);background:linear-gradient(to left,var(--urg-low),var(--urg-high))}
.ax-arrow.x.left .hd{right:auto;left:0;clip-path:polygon(100% 0,0 50%,100% 100%)}
.ax-arrow.x.top .ln{top:calc(100% - 5px)}
.ax-arrow.x.top .hd{top:calc(100% - 5px)}
.ax-arrow .og{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--muted);left:var(--ox,8px);bottom:var(--oy,8px);transform:translate(-50%,50%)}
.ax-lev{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;position:relative;overflow:visible;container-type:size}
.ax-lev span{font-size:12.5px;font-weight:650;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.ax-lev.y span{--rc:var(--muted);color:var(--rc);writing-mode:vertical-rl;transform:rotate(180deg);max-height:100%;font-size:clamp(10.5px,9cqh,14.5px);padding:0 .2em;line-height:1.25;flex:0 0 auto}
.ax-lev.x span{--cc:var(--muted);color:var(--cc);max-width:100%;font-size:clamp(10.5px,5cqw,14.5px)}
.ax-lev .inline-edit,.ax-title .inline-edit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);writing-mode:horizontal-tb;width:150px;font-size:12.5px;z-index:6;background:var(--field)}
.ax-lev.y .inline-edit,.ax-title.y .inline-edit{left:0;transform:translateY(-50%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ax-lev.y span{color:color-mix(in oklab,var(--rc) 72%,#fff)}:root:not([data-theme="light"]) .ax-lev.x span{color:color-mix(in oklab,var(--cc) 72%,#fff)}}
:root[data-theme="dark"] .ax-lev.y span{color:color-mix(in oklab,var(--rc) 72%,#fff)}
:root[data-theme="dark"] .ax-lev.x span{color:color-mix(in oklab,var(--cc) 72%,#fff)}
/* swap button at the common arrow origin (absolutely positioned, no grid track) */
.ax-origin-btn{position:absolute;left:33px;bottom:33px;transform:translate(-50%,50%);width:22px;height:22px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12px;line-height:1;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ax-origin-btn:hover{background:var(--hover);color:var(--text);border-color:var(--faint)}
.matrix-grid.fx .ax-origin-btn{left:auto;right:35px;transform:translate(50%,50%)}
.matrix-grid.fy .ax-origin-btn{bottom:auto;top:35px;transform:translate(-50%,-50%)}
.matrix-grid.fx.fy .ax-origin-btn{transform:translate(50%,-50%)}
[data-edit-label]{cursor:text}
[data-edit-label]:hover span{text-decoration:underline dotted;text-underline-offset:2px}
.inline-edit{width:100%;border:1px solid var(--accent);border-radius:4px;background:var(--field);padding:1px 3px;outline:none;font:inherit;min-width:0}
.cell{--mix:var(--soft);position:relative;background:color-mix(in oklab,var(--mix) var(--tint-cell),var(--panel));border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;container-type:size}
.cell-head{display:flex;align-items:center;gap:6px;padding:4px 6px;background:color-mix(in oklab,var(--mix) var(--tint-head),var(--panel));border-bottom:1px solid var(--line);cursor:default;flex:0 0 auto;min-height:29px;font-size:clamp(11px,3.2cqw,16px);--head-ink:var(--text);color:var(--head-ink)}
.cell-head:hover{background:color-mix(in oklab,var(--mix) calc(var(--tint-head) + 6%),var(--panel))}
.cell-head .coord{font-size:.82em;font-weight:750;line-height:1.5;color:var(--head-ink);border:1px solid var(--head-badge-line,color-mix(in oklab,var(--mix) 45%,var(--panel)));background:var(--head-badge-bg,var(--panel));border-radius:4px;padding:0 .32em;flex:0 0 auto}
.cell-head .cell-name{color:var(--head-ink)}
.cell-head .cell-count{color:var(--head-ink);background:var(--head-badge-bg,var(--panel));border-color:var(--head-badge-line,var(--line))}
.cell-head .cell-add{border:1px solid var(--line);background:var(--panel);border-radius:5px;cursor:pointer;color:var(--muted);width:1.8em;height:1.45em;padding:0;font-size:1.25em;font-weight:700;line-height:1;flex:0 0 auto}
.coord{font-size:10.5px;font-weight:750;color:var(--mix);border:1px solid color-mix(in oklab,var(--mix) 45%,var(--panel));background:var(--panel);border-radius:4px;padding:0 4px;line-height:16px;flex:0 0 auto}
.cell-add{border:1px solid var(--line);background:var(--panel);border-radius:5px;cursor:pointer;color:var(--muted);width:22px;height:20px;padding:0;font-size:15px;font-weight:700;line-height:1;flex:0 0 auto}
.cell-add:hover{background:var(--hover);color:var(--text);border-color:var(--faint)}
.inline-add{width:100%;height:34px;flex:0 0 34px;margin:3px 0;border:1px solid var(--accent);border-radius:6px;background:var(--field);padding:0 8px;outline:none;font:inherit;font-size:12.5px;box-shadow:0 0 0 2px var(--ring)}
.cell-name{font-size:.92em;font-weight:650;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-name:hover{text-decoration:underline dotted;text-underline-offset:2px}
.cell-count{font-size:.8em;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 .4em;line-height:1.5;flex:0 0 auto}
.cell-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:3px 4px 6px;position:relative;overscroll-behavior:contain}
.cell-fade{position:absolute;left:1px;right:1px;bottom:1px;height:18px;background:linear-gradient(to bottom,transparent,var(--panel));opacity:0;pointer-events:none;transition:opacity .15s;border-radius:0 0 7px 7px}
.cell.has-more .cell-fade{opacity:1}
.empty-cell{color:var(--faint);font-size:11.5px;padding:6px 5px;font-style:italic}
.cell-list.drop-empty{outline:2px dashed var(--accent);outline-offset:-2px;border-radius:6px;min-height:30px}
.cell-scroll::-webkit-scrollbar,#inboxBody::-webkit-scrollbar,.drawer-body::-webkit-scrollbar,#mobileCellList::-webkit-scrollbar{width:8px}
.cell-scroll::-webkit-scrollbar-thumb,#inboxBody::-webkit-scrollbar-thumb,.drawer-body::-webkit-scrollbar-thumb,#mobileCellList::-webkit-scrollbar-thumb{background:var(--empty);border-radius:4px}

/* Cards */
.task-card{height:calc(34px*var(--tfs,1));flex:0 0 calc(34px*var(--tfs,1));display:flex;align-items:center;gap:5px;padding:0 4px 0 7px;margin:3px 0;border:1px solid var(--line);border-radius:6px;background:var(--field);cursor:grab;position:relative;user-select:none;min-width:0}
.cell .task-card{height:clamp(calc(32px*var(--tfs,1)),calc(9.5cqw*var(--tfs,1)),calc(46px*var(--tfs,1)));flex-basis:clamp(calc(32px*var(--tfs,1)),calc(9.5cqw*var(--tfs,1)),calc(46px*var(--tfs,1)))}
.task-card.has-label{background:color-mix(in srgb,var(--lt) 11%,var(--field));border-color:color-mix(in srgb,var(--lt) 35%,var(--line))}
.task-card:hover{background:var(--hover);border-color:var(--faint)}
.task-card:active{cursor:grabbing}
.task-card.dragging{opacity:.4}
.task-card.detail-open{outline:2px solid var(--accent);outline-offset:-2px;border-color:var(--accent);z-index:4}
.task-card.filtered{display:none!important}
.task-card.drop-before::before,.task-card.drop-after::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--accent);border-radius:2px;z-index:3}
.task-card.drop-before::before{top:-3px}
.task-card.drop-after::after{bottom:-3px}
.task-title{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:calc(12.5px*var(--tfs,1));line-height:1.2}
/* hovering a cut title unfolds it over the cards below (up to 3 lines), nothing shifts */
.task-card.expand{z-index:6}
.task-card.expand .task-done{position:absolute;right:5px;top:5px;width:21px;border-width:1px;margin:0;opacity:1}
.task-card.expand .task-title{position:absolute;left:-1px;right:-1px;top:-1px;white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;background:var(--hover);border:1px solid var(--faint);border-radius:6px;padding:.55em 2.4em .55em .7em;box-shadow:var(--shadow);line-height:1.3;pointer-events:none}
.cell .task-title{font-size:clamp(calc(12px*var(--tfs,1)),calc(3.2cqw*var(--tfs,1)),calc(15px*var(--tfs,1)))}
.task-meta{display:flex;align-items:center;gap:4px;flex:0 0 auto;font-size:calc(10.5px*var(--tfs,1))}
.cell .task-meta{font-size:clamp(calc(10px*var(--tfs,1)),calc(2.4cqw*var(--tfs,1)),calc(12.5px*var(--tfs,1)))}
.descmark{font-size:0;line-height:0;flex:0 0 auto}.descmark::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--faint)}
.due{color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 3px;line-height:calc(15px*var(--tfs,1));white-space:nowrap;background:var(--panel)}
.coins-badge{color:var(--coin-ink);border:1px solid var(--coin-line);border-radius:4px;padding:0 3px;line-height:calc(15px*var(--tfs,1));white-space:nowrap;background:var(--coin-bg);font-weight:700;flex:0 0 auto}
.coin-float{position:fixed;z-index:260;transform:translate(-50%,-50%);color:var(--coin-ink);font-weight:800;font-size:17px;text-shadow:0 1px 2px var(--panel),0 0 6px var(--panel);pointer-events:none;animation:coinRise .7s ease-out forwards}
@keyframes coinRise{0%{opacity:0;transform:translate(-50%,-50%) scale(.85)}18%{opacity:1}100%{opacity:0;transform:translate(-50%,calc(-50% - 42px)) scale(1.08)}}
.due.soon{color:#6b4300;background:#ffedc2;border-color:#ecc66d}
.due.overdue{color:#fff;background:var(--r);border-color:var(--r);font-weight:700}
:root[data-theme="dark"] .due.soon{color:#ffd98a;background:#493711;border-color:#72551a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .due.soon{color:#ffd98a;background:#493711;border-color:#72551a}}
.task-done{position:relative;z-index:7;opacity:0;border:1px solid var(--line);background:var(--panel);color:var(--g);border-radius:5px;width:21px;height:21px;line-height:18px;font-size:13px;font-weight:800;padding:0;cursor:pointer;flex:0 0 auto}
.task-card:hover .task-done,.task-card:focus-within .task-done{opacity:1}
.task-card:not(:hover):not(:focus-within) .task-done{width:0;border-width:0;margin-left:-5px}
.task-done:hover{background:color-mix(in srgb,var(--g) 12%,var(--panel));border-color:var(--g)}
.task-done:focus-visible{opacity:1}
#dropDone{position:fixed;left:50%;bottom:14px;transform:translate(-50%,calc(100% + 40px));visibility:hidden;z-index:150;background:var(--panel);border:2px solid var(--g);box-shadow:var(--shadow);border-radius:9px;padding:10px 22px;font-weight:650;color:var(--g);transition:transform .18s,visibility 0s .18s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 24px)}
body.dragging #dropDone{transform:translate(-50%,0);pointer-events:auto;visibility:visible;transition:transform .18s}
#dropDone.over{background:color-mix(in srgb,var(--g) 14%,var(--panel))}
.card-stripes{position:absolute;left:0;top:0;bottom:0;display:flex;border-radius:5px 0 0 5px;overflow:hidden;pointer-events:none}
.card-stripes i{display:block;width:5px;height:100%}

/* Labels */
.chip{--lc:var(--muted);--chip-ink:#fff;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--lc);border-radius:999px;padding:1px 8px;font-size:12px;line-height:1.6;cursor:pointer;background:transparent;color:var(--text);max-width:100%}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--lc);border-color:var(--lc);color:var(--chip-ink)}
.chip .chip-dot{width:8px;height:8px;border-radius:50%;background:var(--lc);flex:0 0 auto}
.chip.on .chip-dot{background:var(--chip-ink);opacity:.8}
.chip>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.static{cursor:default}
.chip.static:hover{background:transparent}
.label-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;min-height:4px}
.archive-labels{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.archive-labels .chip{font-size:11px;padding:0 7px}
.label-row{display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:5px;font-size:13.5px}
.label-row:hover{background:var(--hover)}
.label-row input[type=checkbox]{margin:0;flex:0 0 auto;accent-color:var(--accent)}
.menu-list .label-swatch{width:18px;height:18px;border-radius:4px;border:1px solid var(--line);cursor:pointer;padding:0;flex:0 0 auto;min-width:18px}
.label-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
.menu-list .label-del{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:4px;width:22px;height:22px;min-width:22px;padding:0;font-size:15px;line-height:1;flex:0 0 auto}
.menu-list .label-del:hover{background:color-mix(in srgb,var(--r) 14%,var(--panel));color:var(--r)}
.label-edit{flex:1;min-width:0;border:1px solid var(--accent);border-radius:4px;background:var(--field);padding:1px 4px;outline:none;font:inherit;font-size:13px}
.label-new{display:flex;gap:5px;padding:5px 7px}
.label-new input{flex:1 1 auto;min-width:80px;border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--field);font-size:13px}
.menu-list .label-new .btn{width:auto;flex:0 0 auto;padding:3px 10px}
.label-empty{padding:5px 9px 7px;font-size:12px;color:var(--muted)}
.filter-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle;flex:0 0 auto}
.filter-label-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:0 0 auto}
#labelsMenuBtn.filter-active{font-weight:600}
#dLabelNewWrap{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#dLabelNewWrap .inline-edit{flex:1;min-width:120px;padding:5px 7px}

/* label colour popover */
.color-pop{position:fixed;z-index:215;width:238px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px}
.color-pop[hidden]{display:none!important}
.cp-palette{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.cp-swatch{aspect-ratio:1;border-radius:5px;border:1px solid var(--line);padding:0;cursor:pointer}
.cp-swatch.sel{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.cp-divider{height:1px;background:var(--line);margin:1px 0}
.cp-slider{display:grid;grid-template-columns:12px minmax(0,1fr) 30px;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.cp-slider input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:6px;margin:0;border:1px solid var(--line);cursor:pointer}
.cp-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--text);cursor:pointer}
.cp-slider input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--text);cursor:pointer}
.cp-slider output{font:11px ui-monospace,monospace;text-align:right;color:var(--text)}
.cp-bottom{display:flex;align-items:center;gap:6px}
.cp-preview{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);flex:0 0 auto}
.cp-hex{flex:1;min-width:0;border:1px solid var(--line);border-radius:5px;background:var(--field);color:var(--text);padding:4px 6px;font:12px ui-monospace,monospace;text-transform:uppercase}
.cp-hex.bad{border-color:var(--r);box-shadow:0 0 0 1px var(--r)}

/* Auto-save / continue bar */
.continue-bar{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);border:1px solid var(--ring);border-radius:6px;padding:1px 1px 1px 7px;max-width:290px;min-width:0}
.continue-bar .btn{border:0;background:transparent;color:var(--accent);padding:3px 5px;font-size:12px;overflow:hidden;text-overflow:ellipsis;max-width:240px;min-width:0}
.continue-bar .btn:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.continue-dismiss{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:4px;width:20px;height:20px;padding:0;line-height:1;flex:0 0 auto}
.continue-dismiss:hover{background:var(--hover);color:var(--text)}
#fileStatus.retry{cursor:pointer;text-decoration:underline}
.menu-list button:disabled{opacity:.4;cursor:default}
.menu-list button:disabled:hover{background:transparent}

/* Inbox */
#inbox{flex:0 0 220px;width:220px;min-height:0;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;position:relative;transition:flex-basis .18s,width .18s}
.inbox-head{display:flex;align-items:center;gap:6px;padding:8px 9px;border-bottom:1px solid var(--line);flex:0 0 auto}
.inbox-title{font-weight:700;font-size:13.5px;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inbox-count{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 5px;line-height:15px}
.inbox-toggle{border:1px solid var(--line);background:var(--field);border-radius:5px;cursor:pointer;color:var(--muted);width:24px;height:24px;padding:0;line-height:20px;flex:0 0 auto}
.inbox-toggle:hover{background:var(--hover);color:var(--text)}
#inboxBody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 5px 8px}
.inbox-fade{position:absolute;left:1px;right:1px;bottom:1px;height:18px;background:linear-gradient(to bottom,transparent,var(--panel));opacity:0;pointer-events:none;transition:opacity .15s}
#inbox.has-more .inbox-fade{opacity:1}
.inbox-closed-label{display:none;flex:1;align-items:center;justify-content:center;padding:6px 0}
.inbox-closed-label span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:650;color:var(--muted);white-space:nowrap;font-size:12px}
body.inbox-closed #inbox{flex-basis:44px;width:44px}
body.inbox-closed #inbox .inbox-title,body.inbox-closed #inboxBody,body.inbox-closed #inbox .inbox-fade{display:none}
body.inbox-closed #inbox .inbox-head{flex-direction:column;justify-content:flex-start;gap:6px;padding:7px 4px;border-bottom:0}
body.inbox-closed #inbox .inbox-count{display:inline-block;order:1}
body.inbox-closed #inbox .cell-add{display:block;order:2;width:24px;height:24px}
body.inbox-closed #inbox .inbox-toggle{display:block;order:3}
body.inbox-closed .inbox-closed-label{display:flex}
body.inbox-closed .inbox-closed-label span{cursor:pointer}
body.inbox-closed #inbox{cursor:pointer}

/* Drawers */
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100vw;background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 34px rgba(0,0,0,.18);display:flex;flex-direction:column;z-index:90}
.drawer-head{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--line);flex:0 0 auto;min-height:55px}
.drawer-head h2{margin:0;font-size:17px;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-close{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;border-radius:5px;width:30px;height:30px;flex:0 0 auto}
.drawer-close:hover{background:var(--hover);color:var(--text)}
.drawer-body{padding:15px;overflow:auto;flex:1;min-height:0}
.field{display:block;font-size:12px;color:var(--muted);margin:0 0 12px}
.field>span{display:block;margin-bottom:4px;font-weight:600}
.field input[type=text],.field input[type=date],.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:7px 8px;color:var(--text);font-size:14px}
.field textarea{resize:vertical;min-height:100px}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--ring);border-color:var(--accent)}
.field-row{display:flex;gap:6px;align-items:center}
.field-row input{flex:1;min-width:0}
.created-line{font-size:11.5px;color:var(--muted);margin:2px 0 16px}
.drawer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:13px;border-top:1px solid var(--line)}
.drawer-actions .spacer{flex:1}
.archive-search{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:7px 9px;margin-bottom:10px}
.archive-item{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--field);overflow:hidden}
.archive-main{padding:8px 9px;cursor:pointer}
.archive-main:hover{background:var(--hover)}
.archive-title{font-weight:650;font-size:13px;overflow-wrap:anywhere}
.archive-meta{font-size:11px;color:var(--muted);margin-top:2px}
.archive-desc{display:none;border-top:1px solid var(--line);padding:8px 9px;font-size:12.5px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;max-height:150px;overflow:auto}
.archive-item.open .archive-desc{display:block}
.archive-actions{display:flex;gap:6px;padding:0 9px 8px;flex-wrap:wrap}
.archive-empty{color:var(--muted);font-size:13px;padding:18px 6px;text-align:center}
.drawer-foot{padding:10px 15px;border-top:1px solid var(--line);flex:0 0 auto}

/* Desktop detail popover anchored to its card */
#detailDrawer .detail-arrow{display:none}
#detailDrawer.pop{position:fixed;top:auto;right:auto;bottom:auto;left:auto;width:min(380px,calc(100vw - 16px));height:min(460px,90vh);max-height:90vh;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:visible;z-index:140}
#detailDrawer.pop .drawer-head{min-height:0;padding:10px 12px;border-radius:10px 10px 0 0}
#detailDrawer.pop .drawer-head h2{font-size:15px}
#detailDrawer.pop .drawer-body{padding:12px 14px;border-radius:0 0 10px 10px}
#detailDrawer.pop .drawer-actions{margin-top:14px;padding-top:11px}
#detailDrawer.pop .detail-arrow{display:block;position:absolute;top:var(--arrow-top,20px);width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
#detailDrawer.pop.arrow-left .detail-arrow{left:-9px;border-right:10px solid var(--panel)}
#detailDrawer.pop.arrow-right .detail-arrow{right:-9px;border-left:10px solid var(--panel)}

/* Settings dialog */
#settingsDlg{width:calc(100% - 32px);max-width:560px;max-height:85vh;padding:0;overflow:hidden}
#settingsDlg[open]{display:flex;flex-direction:column}
#settingsDlg .dlg-head{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
#settingsDlg .dlg-head h2{font-size:18px;display:flex;align-items:center;gap:6px}
#settingsDlg .set-gear{font-size:17px;line-height:1}
.settings-body{flex:1 1 auto;min-height:0;overflow:auto;padding:2px 18px 18px}
.set-section{padding:14px 0 6px;border-bottom:1px solid var(--line)}
.set-section:last-child{border-bottom:0}
.set-section h3{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.set-size-list{display:flex;flex-direction:column;gap:1px}
.set-size-opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px 6px 30px;position:relative;cursor:pointer;color:var(--text);font-size:13.5px}
.set-size-opt:hover{background:var(--hover)}
.set-size-opt.on{background:var(--accent-soft);border-color:var(--ring)}
.set-size-opt .set-tick{position:absolute;left:9px;color:var(--accent);font-weight:700}
.set-size-opt .set-size-main{font-weight:600}
.set-size-opt .set-size-sub{margin-left:auto;color:var(--muted);font-size:11.5px;text-align:right;padding-left:8px}

.set-row input[type=checkbox]{order:2;margin:0;flex:0 0 auto;-webkit-appearance:none;appearance:none;position:relative;width:1.86em;height:1em;border-radius:.5em;background:var(--empty);cursor:pointer;transition:background .2s;font-size:inherit}
.set-row input[type=checkbox]::after{content:"";position:absolute;left:.14em;top:.14em;width:.72em;height:.72em;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}

@media (prefers-reduced-motion:reduce){.set-row input[type=checkbox],.set-row input[type=checkbox]::after,.auto-switch .sw,.auto-switch .sw::after{transition:none}}

.set-label-del{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:4px;width:26px;height:24px;min-width:26px;padding:0;font-size:14px;line-height:1;flex:0 0 auto}

.set-label-rename{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:4px;width:24px;height:24px;min-width:24px;padding:0;font-size:13px;line-height:1;flex:0 0 auto}

.set-label-new{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}

#setThemeSeg button{min-width:58px}

.set-tint input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:7px;margin:0;border:1px solid var(--line);cursor:pointer;background:linear-gradient(to right,var(--panel),color-mix(in oklab,var(--r) 45%,var(--panel)))}
.set-tint input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--panel);border:2px solid var(--text);cursor:pointer}

.linkbtn{border:0;background:transparent;color:var(--accent);cursor:pointer;padding:0;font-size:12px;text-decoration:underline;white-space:nowrap}

/* Gold coins */

#dCoins{width:92px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--text);padding:5px 7px;font-size:13px}
#accountDlg{width:calc(100% - 32px);max-width:560px;max-height:85vh;padding:0;overflow:hidden}

#accountDlg .settings-body{padding:2px 18px 18px}
.acc-balance{font-size:34px;font-weight:800;color:var(--coin-ink);text-align:center;padding:16px 0 6px;letter-spacing:.02em;line-height:1.1}
.acc-form{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:8px;align-items:end}
.acc-field{display:block;font-size:12px;color:var(--muted)}
.acc-field>span{display:block;margin-bottom:4px;font-weight:600}
.acc-field input{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:6px 8px;color:var(--text);font-size:13.5px}
.acc-field input:focus{outline:2px solid var(--ring);border-color:var(--accent)}
.acc-msg{font-size:12.5px;color:var(--r);margin-top:7px}
.acc-rewards{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.acc-reward{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.acc-buy{flex:1 1 170px;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis}
.acc-buy:disabled{opacity:.42;cursor:default}
.acc-buy:disabled:hover{background:var(--field)}
.acc-iconbtn{border:1px solid var(--line);background:var(--field);color:var(--muted);border-radius:5px;width:28px;height:28px;min-width:28px;padding:0;font-size:13px;line-height:1;cursor:pointer;flex:0 0 auto}
.acc-iconbtn:hover{background:var(--hover);color:var(--text)}
.acc-iconbtn.del:hover{background:color-mix(in srgb,var(--r) 12%,var(--panel));color:var(--r);border-color:var(--danger-line)}
.acc-reward-add{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:8px}
.acc-reward-add input[type=text]{flex:1 1 140px;min-width:100px;border:1px solid var(--line);border-radius:5px;padding:5px 7px;background:var(--field);color:var(--text);font-size:13px}
.acc-reward-add input[type=number]{width:92px;border:1px solid var(--line);border-radius:5px;padding:5px 7px;background:var(--field);color:var(--text);font-size:13px}
.acc-edit-name{flex:1 1 120px;min-width:90px;border:1px solid var(--accent);border-radius:5px;padding:4px 6px;background:var(--field);color:var(--text);font-size:13px}
.acc-edit-price{width:90px;border:1px solid var(--accent);border-radius:5px;padding:4px 6px;background:var(--field);color:var(--text);font-size:13px}
.acc-hist{display:flex;flex-direction:column;gap:2px}
.acc-hist-row{display:grid;grid-template-columns:112px 58px minmax(0,1fr);gap:7px;align-items:baseline;font-size:12.5px;padding:4px 5px;border-radius:5px}
.acc-hist-row:hover{background:var(--hover)}
.acc-hist-when{color:var(--muted);font-size:11.5px;white-space:nowrap}
.acc-hist-amt{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.acc-hist-amt.pos{color:var(--g)}
.acc-hist-amt.neg{color:var(--r)}
.acc-hist-amt.zero{color:var(--muted)}
.acc-hist-text{overflow-wrap:anywhere}
.acc-empty{color:var(--muted);font-size:12.5px;padding:5px 6px}
.acc-more{margin-top:7px}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);max-width:680px;width:calc(100% - 32px);padding:20px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:calc(100vh - 40px);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.dlg-head h2{margin:0;font-size:19px}
.dlg-close{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;border-radius:5px;width:30px;height:30px;flex:0 0 auto}
.dlg-close:hover{background:var(--hover);color:var(--text)}
.intro{color:var(--muted);margin:0 0 12px}
.help-list{padding-left:20px;margin:0;font-size:13.5px}
.help-list li{margin-bottom:7px}
.help-list a{color:var(--accent)}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--soft);white-space:nowrap}
.offline{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.offline p{margin:0;font-size:12.5px;color:var(--muted)}
.offline p b{color:var(--text)}
.dlg-foot{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.repo{margin:14px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);text-align:center}
.repo a{color:var(--accent)}
.btnrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* Mobile */
#mobileView{display:none}
#mobileMenuBtn{display:none}
.mobile-only{display:none!important}
#printHead{display:none}
#movePicker{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:170;display:flex;align-items:flex-end;justify-content:center;padding:12px}
#movePicker[hidden]{display:none!important}
.picker-card{width:min(560px,100%);max-height:82vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.picker-card h2{font-size:15px;margin:0 0 3px;overflow-wrap:anywhere}
.picker-sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.picker-grid{display:grid;gap:5px;margin:8px 0}
.picker-grid button{--mix:var(--muted);border:1px solid var(--line);background:color-mix(in oklab,var(--mix) var(--tint-tile),var(--panel));border-radius:7px;padding:8px 5px;cursor:pointer;min-height:44px;font-size:11px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.picker-grid button:hover{background:color-mix(in oklab,var(--mix) calc(var(--tint-tile) + 6%),var(--panel))}
.picker-grid .pick-co{font-weight:750;color:var(--mix);display:block;font-size:10px}
.picker-done{border-color:var(--g)!important;color:var(--g);font-weight:700}
.picker-inbox{border-style:dashed!important}
.tile-dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--orange)}
.tile-dot.overdue{background:var(--r)}
#mobileView{flex:1;min-width:0;min-height:0;flex-direction:column}
.mobile-list-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.mobile-cell-head{--mix:var(--muted);display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:color-mix(in oklab,var(--mix) var(--tint-head),var(--panel));flex:0 0 auto;--head-ink:var(--text);color:var(--head-ink)}
.mobile-cell-head .coord{color:var(--head-ink);background:var(--head-badge-bg,var(--panel));border-color:var(--head-badge-line,var(--line))}
.mobile-cell-head h2{color:var(--head-ink)}
.mobile-cell-head .inbox-count{color:var(--head-ink);background:var(--head-badge-bg,var(--panel));border-color:var(--head-badge-line,var(--line))}
.mobile-cell-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.mobile-cell-title h2{font-size:14px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mobile-levels{font-size:11.5px;font-weight:600;color:color-mix(in oklab,var(--mix) 70%,var(--text));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mobile-cell-head .cell-add{width:32px;height:32px;font-size:19px;border-radius:7px}
#mobileCellList{flex:1;min-height:0;overflow-y:auto;padding:6px 8px;touch-action:pan-y}
#mobileCellList .cell-list{position:relative;min-height:100%}
.mobile-empty{color:var(--faint);font-size:12.5px;font-style:italic;padding:18px 10px;text-align:center;line-height:1.45}
.mobile-pad{--pad-y-low:var(--imp-low);--pad-y-high:var(--imp-high);--pad-x-low:var(--urg-low);--pad-x-high:var(--urg-high);flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:14px 10px minmax(0,1fr) auto;grid-template-rows:auto 10px auto;gap:0;align-items:stretch}
.mobile-pad.axes-swapped{--pad-y-low:var(--urg-low);--pad-y-high:var(--urg-high);--pad-x-low:var(--imp-low);--pad-x-high:var(--imp-high)}
#mobilePad{grid-row:1;grid-column:3;display:grid;grid-template-columns:repeat(var(--mcols,3),minmax(44px,1fr));gap:4px}
.pad-cell{--mix:var(--muted);min-width:44px;min-height:44px;border:1px solid color-mix(in oklab,var(--mix) 45%,var(--line));border-radius:8px;background:color-mix(in oklab,var(--mix) var(--tint-tile),var(--panel));color:var(--text);font-size:14px;font-weight:750;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;padding:0}
.pad-cell.sel{border:2px solid var(--mix);box-shadow:0 0 0 2px color-mix(in oklab,var(--mix) 40%,transparent)}
.pad-cell.drop-hover{outline:3px solid var(--accent);outline-offset:-3px}
.pad-cell .pad-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--orange)}
.pad-cell .pad-dot.overdue{background:var(--r)}
#mobileInboxBtn{grid-row:1;grid-column:4;margin-left:6px;min-width:54px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:650;cursor:pointer;padding:2px 5px;line-height:1.15}
body.no-inbox #inbox,body.no-inbox #mobileInboxBtn,body.no-inbox .picker-inbox{display:none!important}
.set-hint{margin:2px 0 0 0;font-size:12px;color:var(--muted)}
#mobileInboxBtn.sel{border:2px solid var(--accent);box-shadow:0 0 0 2px var(--ring)}
#mobileInboxBtn.drop-hover{outline:3px solid var(--accent);outline-offset:-3px}
#mobileInboxBtn .inbox-count{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 5px;line-height:15px}
#mobileInboxBtn.sel .inbox-count{color:var(--accent);border-color:var(--ring)}
.pad-title{font-size:11px;font-weight:700;color:var(--text);white-space:nowrap;letter-spacing:.02em;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.pad-title.y{grid-row:1;grid-column:1;writing-mode:vertical-rl;transform:rotate(180deg);justify-self:center;align-self:center;max-height:100%}
.pad-title.x{grid-row:3;grid-column:3;text-align:center;padding-top:1px}
/* both arrows start in the same origin: the centre of the 10px arrow tracks */
.pad-arrow{position:relative;pointer-events:none}
.pad-arrow::before{content:"";position:absolute;border-radius:1px}
.pad-arrow::after{content:"";position:absolute;width:0;height:0}
.pad-arrow.y{grid-row:1 / span 2;grid-column:2}
.pad-arrow.y::before{left:4px;width:2px;top:6px;bottom:4px;background:linear-gradient(to top,var(--pad-y-low),var(--pad-y-high))}
.pad-arrow.y::after{left:1px;top:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:6px solid var(--pad-y-high)}
.pad-arrow.x{grid-row:2;grid-column:2 / span 2}
.pad-arrow.x::before{top:4px;height:2px;left:4px;right:6px;background:linear-gradient(to right,var(--pad-x-low),var(--pad-x-high))}
.pad-arrow.x::after{top:1px;right:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:6px solid var(--pad-x-high)}
/* mirrored pad: origin follows the same corner as the desktop matrix */
.mobile-pad.fx{grid-template-columns:minmax(0,1fr) 10px 14px auto}
.mobile-pad.fx #mobilePad{grid-column:1}
.mobile-pad.fx .pad-title.y{grid-column:3}
.mobile-pad.fx .pad-title.x{grid-column:1}
.mobile-pad.fx .pad-arrow.x{grid-column:1 / span 2}
.mobile-pad.fx .pad-arrow.x::before{left:6px;right:4px;background:linear-gradient(to left,var(--pad-x-low),var(--pad-x-high))}
.mobile-pad.fx .pad-arrow.x::after{right:auto;left:0;border-left:0;border-right:6px solid var(--pad-x-high)}
.mobile-pad.fy{grid-template-rows:auto 10px auto}
.mobile-pad.fy .pad-title.x{grid-row:1;padding-top:0;padding-bottom:1px}
.mobile-pad.fy #mobilePad,.mobile-pad.fy #mobileInboxBtn,.mobile-pad.fy .pad-title.y{grid-row:3}
.mobile-pad.fy .pad-arrow.y{grid-row:2 / span 2}
.mobile-pad.fy .pad-arrow.y::before{top:4px;bottom:6px;background:linear-gradient(to bottom,var(--pad-y-low),var(--pad-y-high))}
.mobile-pad.fy .pad-arrow.y::after{top:auto;bottom:0;border-bottom:0;border-top:6px solid var(--pad-y-high)}
.drag-ghost{position:fixed;z-index:400;pointer-events:none;opacity:.93;box-shadow:var(--shadow);transform:rotate(1.5deg);background:var(--field);border-radius:6px}
.task-card.drag-src{opacity:.35}
.swipe-reveal{position:absolute;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--g) 16%,var(--panel));color:var(--g);border:1px solid var(--g);border-radius:6px;font-size:19px;font-weight:800;z-index:0}
.swipe-reveal.armed{background:var(--g);color:#fff;border-color:var(--g)}
.task-card.swiping{position:relative;z-index:1;transition:none;touch-action:pan-y}
#toast .toast-act{margin-left:9px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:5px;padding:1px 8px;font-size:12px;cursor:pointer}

function migrateColLabels(st){
  const swapped=!!st.swapped;
  const labels=swapped?st.rowLabels:st.colLabels;
  const old=OLD_COL_LEVELS.find(o=>o.length===labels.length&&o.every((v,i)=>labels[i]===v));
  if(old){
    const lang=['später','irgendwann'].includes(old[0])?'de':'en';
    const next=COL_LEVELS[lang][labels.length].slice();
    if(swapped) st.rowLabels=next.reverse(); else st.colLabels=next;
  }
}

function defaultMatrix(rows,cols,lang=LANG){
  const de=lang==='de';

  const colLabels=(COL_LEVELS[de?'de':'en'][cols]||COL_LEVELS.de[3]).slice();
  let cellNames;
  if(rows===1&&cols===1) cellNames=[[de?'Aufgaben':'Tasks']];
  else if(rows===1) cellNames=[colLabels.slice()];
  else if(cols===1) cellNames=rowLabels.map(x=>[x]);
  else if(CELL_NAMES[de?'de':'en'][rows+'x'+cols]) cellNames=CELL_NAMES[de?'de':'en'][rows+'x'+cols].map(r=>r.slice());
  else cellNames=Array.from({length:rows},()=>Array.from({length:cols},()=>''));

/* Swap axes: the stored data is transposed. Vertical (rows, index 0 top) shows the
   vertical quantity, horizontal (cols, index 0 left) the horizontal quantity.
   Old (r,c) maps to (C-1-c, R-1-r): most important/urgent stays top right. */
function transposeDef(d){
  const R=d.rowLabels.length,C=d.colLabels.length;
  return {
    axisY:d.axisX, axisX:d.axisY,
    rowLabels:d.colLabels.slice().reverse(),
    colLabels:d.rowLabels.slice().reverse(),
    cellNames:Array.from({length:C},(_,r)=>Array.from({length:R},(_,c)=>d.cellNames[R-1-c]?.[C-1-r]??''))

function defaultForLayout(rows,cols,lang=LANG,swapped=state.swapped){
  return swapped?transposeDef(defaultMatrix(cols,rows,lang)):defaultMatrix(rows,cols,lang);
}
function transposeCell(cell,R,C){return Array.isArray(cell)?[C-1-cell[1],R-1-cell[0]]:cell;}
function transposeEntries(tasks,archive,R,C){
  for(const task of tasks){
    task.cell=transposeCell(task.cell,R,C);
    if(Array.isArray(task.at)) task.at=[task.at[1],task.at[0]];
  }
  for(const item of archive){
    item.cell=transposeCell(item.cell,R,C);
    if(item.fromCell) item.fromCell=transposeCell(item.fromCell,R,C);
    if(Array.isArray(item.at)) item.at=[item.at[1],item.at[0]];
  }
}
/* continuous position: fy = importance (1 = top), fx = urgency (1 = right) */
function cellCenter(r,c,R,C){return [1-(r+0.5)/R,(c+0.5)/C];}
function cellFromAt(at,R,C){
  const fy=clamp(Number(at[0]),0,1), fx=clamp(Number(at[1]),0,1);
  const y=(1-fy)*R, x=fx*C;
  const yi=Math.round(y), xi=Math.round(x);
  let r=Math.abs(y-yi)<1e-9?yi-1:Math.floor(y);
  let c=Math.abs(x-xi)<1e-9?xi:Math.floor(x);
  return [clamp(r,0,R-1),clamp(c,0,C-1)];

function isValidDateStr(s){
  if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y,m,d]=s.split('-').map(Number), dt=new Date(Date.UTC(y,m-1,d));
  return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d;

const isValidISODate=s=>typeof s==='string'&&s.length>=10&&s.length<=40&&!Number.isNaN(Date.parse(s));
function reqStr(v,path,max,allowEmpty=true){
  if(typeof v!=='string'||v.length>max||(!allowEmpty&&!v.trim())) throw new Error(t('invalidReason',path));
  return v;
}
function reqCoord(v,path,rows,cols,nullable=false){
  if(v==null&&nullable) return null;
  if(!Array.isArray(v)||v.length!==2||!Number.isInteger(v[0])||!Number.isInteger(v[1])||v[0]<0||v[0]>=rows||v[1]<0||v[1]>=cols) throw new Error(t('invalidReason',path));
  return [v[0],v[1]];
}
function reqAt(v,path){
  if(v==null) return null;
  if(!Array.isArray(v)||v.length!==2||typeof v[0]!=='number'||typeof v[1]!=='number'||!Number.isFinite(v[0])||!Number.isFinite(v[1])||v[0]<0||v[0]>1||v[1]<0||v[1]>1) throw new Error(t('invalidReason',path));
  return [v[0],v[1]];
}
function reqTaskCoins(v,path){
  if(v===undefined) return 0;

function cleanTask(x,path,isArchive,rows,cols,labelIds){
  if(!x||typeof x!=='object'||Array.isArray(x)) throw new Error(t('invalidReason',path));
  const id=reqStr(x.id,path+'.id',MAX_ID,false);
  if(!/^[A-Za-z0-9_-]+$/.test(id)) throw new Error(t('invalidReason',path+'.id'));
  const title=reqStr(x.title,path+'.title',MAX_TITLE);
  const desc=reqStr(x.desc,path+'.desc',MAX_DESC);
  const due=x.due===null?null:reqStr(x.due,path+'.due',10,false);
  if(due!==null&&!isValidDateStr(due)) throw new Error(t('invalidReason',path+'.due'));
  const created=reqStr(x.created,path+'.created',40,false);
  if(!isValidISODate(created)) throw new Error(t('invalidReason',path+'.created'));
  const out={id,title,desc,due,cell:reqCoord(x.cell,path+'.cell',rows,cols,true),at:reqAt(x.at,path+'.at'),created,labels:[],coins:reqTaskCoins(x.coins,path+'.coins')};
  if(x.mod!==undefined&&x.mod!==null){
    out.mod=reqStr(x.mod,path+'.mod',40,false);
    if(!isValidISODate(out.mod)) throw new Error(t('invalidReason',path+'.mod'));
  }
  if(x.labels!==undefined){
    if(!Array.isArray(x.labels)) throw new Error(t('invalidReason',path+'.labels'));
    out.labels=[...new Set(x.labels.filter(l=>typeof l==='string'&&labelIds.has(l)))];
  }
  if(isArchive){
    out.doneAt=reqStr(x.doneAt,path+'.doneAt',40,false);
    if(!isValidISODate(out.doneAt)) throw new Error(t('invalidReason',path+'.doneAt'));
    out.fromCell=reqCoord(x.fromCell,path+'.fromCell',rows,cols,true);
    if(!out.at&&out.fromCell) out.at=cellCenter(out.fromCell[0],out.fromCell[1],rows,cols);
  }
  if(!out.at&&out.cell) out.at=cellCenter(out.cell[0],out.cell[1],rows,cols);
  return out;
}
function cleanCoins(raw){
  const out={enabled:false,balance:0,rewards:[],log:[]};
  if(raw===undefined||raw===null) return out;
  if(typeof raw!=='object'||Array.isArray(raw)) throw new Error(t('invalidReason','coins'));
  if(raw.enabled!==undefined){
    if(typeof raw.enabled!=='boolean') throw new Error(t('invalidReason','coins.enabled'));
    out.enabled=raw.enabled;
  }
  if(raw.balance!==undefined){
    if(!Number.isInteger(raw.balance)||raw.balance<0||raw.balance>MAX_COIN_BALANCE) throw new Error(t('invalidReason','coins.balance'));
    out.balance=raw.balance;
  }
  if(raw.rewards!==undefined){
    if(!Array.isArray(raw.rewards)) throw new Error(t('invalidReason','coins.rewards'));
    const ids=new Set();
    out.rewards=raw.rewards.map((x,i)=>{
      if(!x||typeof x!=='object'||Array.isArray(x)) throw new Error(t('invalidReason','coins.rewards['+i+']'));
      const id=reqStr(x.id,'coins.rewards['+i+'].id',MAX_ID,false);
      if(!/^[A-Za-z0-9_-]+$/.test(id)||ids.has(id)) throw new Error(t('invalidReason','coins.rewards['+i+'].id'));
      ids.add(id);
      const name=reqStr(x.name,'coins.rewards['+i+'].name',MAX_REWARD_NAME,false);
      if(!name.trim()) throw new Error(t('invalidReason','coins.rewards['+i+'].name'));
      if(!Number.isInteger(x.price)||x.price<1||x.price>MAX_REWARD_PRICE) throw new Error(t('invalidReason','coins.rewards['+i+'].price'));
      return {id,name,price:x.price};
    });
  }
  if(raw.log!==undefined){
    if(!Array.isArray(raw.log)) throw new Error(t('invalidReason','coins.log'));
    const kept=raw.log.length>MAX_COIN_LOG?raw.log.slice(-MAX_COIN_LOG):raw.log;
    out.log=kept.map((x,i)=>{
      if(!x||typeof x!=='object'||Array.isArray(x)) throw new Error(t('invalidReason','coins.log['+i+']'));
      const id=reqStr(x.id,'coins.log['+i+'].id',MAX_ID,false);
      if(!/^[A-Za-z0-9_-]+$/.test(id)) throw new Error(t('invalidReason','coins.log['+i+'].id'));
      const at=reqStr(x.at,'coins.log['+i+'].at',40,false);
      if(!isValidISODate(at)) throw new Error(t('invalidReason','coins.log['+i+'].at'));
      if(!Number.isInteger(x.amount)||x.amount<-MAX_COIN_BALANCE||x.amount>MAX_COIN_BALANCE) throw new Error(t('invalidReason','coins.log['+i+'].amount'));
      const text=reqStr(x.text,'coins.log['+i+'].text',MAX_COIN_TEXT);
      let taskId=null;
      if(x.taskId!==undefined&&x.taskId!==null){
        taskId=reqStr(x.taskId,'coins.log['+i+'].taskId',MAX_ID,false);
        if(!/^[A-Za-z0-9_-]+$/.test(taskId)) throw new Error(t('invalidReason','coins.log['+i+'].taskId'));
      }
      return {id,at,amount:x.amount,text,taskId};
    });
  }
  return out;
}
function validateState(raw){
  if(!raw||typeof raw!=='object'||Array.isArray(raw)) throw new Error(t('invalidReason','root'));
  if(raw.format!==FORMAT) throw new Error(t('invalidReason','format'));
  if(!Number.isInteger(raw.version)) throw new Error(t('invalidReason','version'));
  if(raw.version>VERSION) throw new Error(t('fileTooNew'));
  if(raw.version!==VERSION) throw new Error(t('invalidReason','version'));
  if(!Number.isInteger(raw.rows)||raw.rows<1||raw.rows>5) throw new Error(t('invalidReason','rows'));
  if(!Number.isInteger(raw.cols)||raw.cols<1||raw.cols>5) throw new Error(t('invalidReason','cols'));
  const rows=raw.rows,cols=raw.cols;
  let swapped=false;
  if(raw.swapped!==undefined){
    if(typeof raw.swapped!=='boolean') throw new Error(t('invalidReason','swapped'));
    swapped=raw.swapped;
  }
  let flipX=false,flipY=false;
  if(raw.flipX!==undefined){
    if(typeof raw.flipX!=='boolean') throw new Error(t('invalidReason','flipX'));
    flipX=raw.flipX;
  }
  if(raw.flipY!==undefined){
    if(typeof raw.flipY!=='boolean') throw new Error(t('invalidReason','flipY'));
    flipY=raw.flipY;
  }
  const title=reqStr(raw.title,'title',MAX_TITLE);
  const axisY=reqStr(raw.axisY,'axisY',MAX_AXIS);
  const axisX=reqStr(raw.axisX,'axisX',MAX_AXIS);
  if(!Array.isArray(raw.rowLabels)||raw.rowLabels.length!==rows) throw new Error(t('invalidReason','rowLabels'));
  if(!Array.isArray(raw.colLabels)||raw.colLabels.length!==cols) throw new Error(t('invalidReason','colLabels'));
  const rowLabels=raw.rowLabels.map((v,i)=>reqStr(v,'rowLabels['+i+']',MAX_LABEL));
  const colLabels=raw.colLabels.map((v,i)=>reqStr(v,'colLabels['+i+']',MAX_LABEL));
  if(!Array.isArray(raw.cellNames)||raw.cellNames.length!==rows) throw new Error(t('invalidReason','cellNames'));
  const cellNames=raw.cellNames.map((line,r)=>{
    if(!Array.isArray(line)||line.length!==cols) throw new Error(t('invalidReason','cellNames['+r+']'));
    return line.map((v,c)=>reqStr(v,'cellNames['+r+']['+c+']',MAX_LABEL));
  });
  const rawLabels=raw.labels===undefined?[]:raw.labels;
  if(!Array.isArray(rawLabels)||rawLabels.length>MAX_LABELS) throw new Error(t('invalidReason','labels'));
  const labels=rawLabels.map((x,i)=>{
    if(!x||typeof x!=='object'||Array.isArray(x)) throw new Error(t('invalidReason','labels['+i+']'));
    const id=reqStr(x.id,'labels['+i+'].id',MAX_ID,false);
    if(!/^[A-Za-z0-9_-]+$/.test(id)) throw new Error(t('invalidReason','labels['+i+'].id'));
    const name=reqStr(x.name,'labels['+i+'].name',MAX_LABEL_NAME,false);
    if(typeof x.color!=='string'||!LABEL_COLOR.test(x.color)) throw new Error(t('invalidReason','labels['+i+'].color'));
    return {id,name,color:x.color.toLowerCase()};
  });
  const labelIds=new Set();
  for(const l of labels){
    if(labelIds.has(l.id)) throw new Error(t('invalidReason','labels (duplicate)'));
    labelIds.add(l.id);
  }
  if(!Array.isArray(raw.tasks)) throw new Error(t('invalidReason','tasks'));
  if(!Array.isArray(raw.archive)) throw new Error(t('invalidReason','archive'));
  const tasks=raw.tasks.map((x,i)=>cleanTask(x,'tasks['+i+']',false,rows,cols,labelIds));
  const archive=raw.archive.map((x,i)=>cleanTask(x,'archive['+i+']',true,rows,cols,labelIds));
  const seen=new Set();
  for(const x of [...tasks,...archive]){
    if(seen.has(x.id)) throw new Error(t('invalidReason','id (duplicate)'));
    seen.add(x.id);
  }
  const coins=cleanCoins(raw.coins);
  let savedAt=null;
  if(raw.savedAt!==undefined&&raw.savedAt!==null){
    savedAt=reqStr(raw.savedAt,'savedAt',40,false);
    if(!isValidISODate(savedAt)) throw new Error(t('invalidReason','savedAt'));
  }
  return {format:FORMAT,version:VERSION,title,rows,cols,swapped,flipX,flipY,axisY,axisX,rowLabels,colLabels,cellNames,tasks,archive,labels,coins,savedAt};
}

function applyHeadContrast(){

  if(!heads.length) return;
  const panel=probeCssColor('var(--panel)')||WHITE_RGB;
  const panelLight=relativeLum(panel)>0.42;
  const lumDark=relativeLum(HEAD_DARK);
  for(const head of heads){
    const bg=parseCssColor(getComputedStyle(head).backgroundColor);
    if(!bg) continue;
    const lb=relativeLum(bg);
    const darkInk=contrastRatio(lb,lumDark)>=contrastRatio(lb,1);

    head.dataset.head=darkInk?'light':'dark';

/* ---------- three-way merge (used by the Google Drive sync) ---------- */
/* base is the last synced Drive content or null; local/remote are validated states */
function cloneState(st){return JSON.parse(JSON.stringify(st));}
function entryIndex(st){
  const m=new Map();
  for(const e of st.tasks||[]) m.set(e.id,{place:'tasks',entry:e});
  for(const e of st.archive||[]) m.set(e.id,{place:'archive',entry:e});
  return m;
}
const entryJson=v=>v===undefined?null:JSON.stringify(v);
const entryEqual=(a,b)=>entryJson(a)===entryJson(b);
function entryModTime(v){
  const raw=v&&v.entry&&v.entry.mod;
  const t=typeof raw==='string'?Date.parse(raw):NaN;
  return Number.isFinite(t)?t:-Infinity;
}
/* both changed: the newer mod wins, ties go to remote (missing mod = oldest) */
function newerEntry(l,r){return entryModTime(l)>entryModTime(r)?l:r;}
function mergeStates(base,local,remote){
  let b=base?cloneState(base):null;
  let l=cloneState(local);
  const r=remote;
  const hasBase=!!b;
  let conflicts=0;

  /* structure first: bring local (and base) into the structure of remote */
  if(l.swapped!==r.swapped) l=transposeStateCore(l);
  if(b&&b.swapped!==r.swapped) b=transposeStateCore(b);
  if(l.rows!==r.rows||l.cols!==r.cols) l=resizeStateCore(l,r.rows,r.cols,LANG);
  if(b&&(b.rows!==r.rows||b.cols!==r.cols)) b=resizeStateCore(b,r.rows,r.cols,LANG);

  /* three-way per scalar; with no base remote wins unless it is undefined */
  const three=(bv,lv,rv,countConflict)=>{
    if(hasBase){
      if(lv===bv) return rv;
      if(rv===bv) return lv;
      if(lv!==rv&&countConflict) conflicts++;
      return rv;
    }
    return rv===undefined?lv:rv;
  };
  /* display-only flips: remote wins unless only local changed them */
  const mergeFlip=(bv,lv,rv)=>{
    if(!hasBase) return rv;
    if(lv===bv) return rv;
    if(rv===bv) return lv;
    return rv;
  };

  const title=three(hasBase?b.title:undefined,l.title,r.title,true);
  const axisY=three(hasBase?b.axisY:undefined,l.axisY,r.axisY,true);
  const axisX=three(hasBase?b.axisX:undefined,l.axisX,r.axisX,true);
  const rowLabels=Array.from({length:r.rows},(_,i)=>three(hasBase?b.rowLabels[i]:undefined,l.rowLabels[i],r.rowLabels[i],true));
  const colLabels=Array.from({length:r.cols},(_,i)=>three(hasBase?b.colLabels[i]:undefined,l.colLabels[i],r.colLabels[i],true));
  const cellNames=Array.from({length:r.rows},(_,ri)=>Array.from({length:r.cols},(_,ci)=>
    three(hasBase?b.cellNames[ri]?.[ci]:undefined,l.cellNames[ri]?.[ci],r.cellNames[ri]?.[ci],true)));
  const flipX=mergeFlip(hasBase?b.flipX:undefined,l.flipX,r.flipX);
  const flipY=mergeFlip(hasBase?b.flipY:undefined,l.flipY,r.flipY);

  /* tasks and archive, keyed by id (entries may move between the two lists) */
  const lIdx=entryIndex(l),rIdx=entryIndex(r),bIdx=b?entryIndex(b):null;
  const ids=new Set([...lIdx.keys(),...rIdx.keys(),...(bIdx?bIdx.keys():[])]);
  const chosen=new Map();
  for(const id of ids){
    const le=lIdx.get(id),re=rIdx.get(id),be=bIdx?bIdx.get(id):undefined;
    let pick;
    if(!bIdx){
      if(le&&re) pick=newerEntry(le,re);
      else pick=le||re;
    }else if(entryEqual(le,be)){
      pick=re;
    }else if(entryEqual(re,be)){
      pick=le;
    }else if(!le){
      pick=re;
    }else if(!re){
      pick=le;
    }else{
      pick=newerEntry(le,re);
      if(!entryEqual(le,re)) conflicts++;
    }
    if(pick) chosen.set(id,pick); else chosen.delete(id);
  }
  const orderList=(place,localList,remoteList)=>{
    const out=remoteList.filter(e=>{const c=chosen.get(e.id);return c&&c.place===place;}).map(e=>e.id);
    const seen=new Set(out);
    for(const e of localList){
      const c=chosen.get(e.id);
      if(!c||c.place!==place||seen.has(e.id)) continue;
      let prev=null;
      for(const p of localList){
        if(p.id===e.id) break;
        if(seen.has(p.id)) prev=p.id;
      }
      const at=prev?out.indexOf(prev)+1:out.length;
      out.splice(at,0,e.id); seen.add(e.id);
    }
    for(const [id,c] of chosen){
      if(c.place===place&&!seen.has(id)){out.push(id);seen.add(id);}
    }
    return out.map(id=>cloneState(chosen.get(id).entry));
  };
  const tasks=orderList('tasks',l.tasks,r.tasks);
  const archive=orderList('archive',l.archive,r.archive);

  /* labels: same three-way rules; both changed -> remote */
  const labelList=st=>Array.isArray(st.labels)?st.labels:[];
  const labelIdx=list=>{const m=new Map();for(const x of list)m.set(x.id,x);return m;};
  const lLabels=labelIdx(labelList(l)),rLabels=labelIdx(labelList(r)),bLabels=b?labelIdx(labelList(b)):null;
  const labelIds=new Set([...lLabels.keys(),...rLabels.keys(),...(bLabels?bLabels.keys():[])]);
  const labelChosen=new Map();
  for(const id of labelIds){
    const le=lLabels.get(id),re=rLabels.get(id),be=bLabels?bLabels.get(id):undefined;
    let pick;
    if(!bLabels) pick=re||le;
    else if(JSON.stringify(le)===JSON.stringify(be)) pick=re;
    else if(JSON.stringify(re)===JSON.stringify(be)) pick=le;
    else if(!le) pick=re;
    else if(!re) pick=le;
    else pick=re;
    if(pick) labelChosen.set(id,pick);
  }
  const labels=[];
  const takeLabel=x=>{if(!labelChosen.has(x.id))return;labels.push(cloneState(labelChosen.get(x.id)));labelChosen.delete(x.id);};
  for(const x of labelList(r)) takeLabel(x);
  for(const x of labelList(l)) takeLabel(x);
  for(const v of labelChosen.values()) labels.push(cloneState(v));

  /* coins */
  const lc=l.coins||{},rc=r.coins||{},bc=b?(b.coins||{}):null;
  const enabled=bc?three(!!bc.enabled,!!lc.enabled,!!rc.enabled,true):(rc.enabled===undefined?!!lc.enabled:!!rc.enabled);
  const rewardsIdx=list=>{const m=new Map();for(const x of list||[])m.set(x.id,x);return m;};
  const lRew=rewardsIdx(lc.rewards),rRew=rewardsIdx(rc.rewards),bRew=bc?rewardsIdx(bc.rewards):null;
  const rewardIds=new Set([...lRew.keys(),...rRew.keys(),...(bRew?bRew.keys():[])]);
  const rewardChosen=new Map();
  for(const id of rewardIds){
    const le=lRew.get(id),re=rRew.get(id),be=bRew?bRew.get(id):undefined;
    let pick;
    if(!bRew) pick=re||le;
    else if(JSON.stringify(le)===JSON.stringify(be)) pick=re;
    else if(JSON.stringify(re)===JSON.stringify(be)) pick=le;
    else if(!le) pick=re;
    else if(!re) pick=le;
    else pick=re;
    if(pick) rewardChosen.set(id,pick);
  }
  const rewards=[];
  const takeReward=x=>{if(!rewardChosen.has(x.id))return;rewards.push(cloneState(rewardChosen.get(x.id)));rewardChosen.delete(x.id);};
  for(const x of rc.rewards||[]) takeReward(x);
  for(const x of lc.rewards||[]) takeReward(x);
  for(const v of rewardChosen.values()) rewards.push(cloneState(v));

  /* log: union by id, sorted by at, capped like the validator */
  const logById=new Map();
  for(const x of rc.log||[]) logById.set(x.id,x);
  for(const x of lc.log||[]) if(!logById.has(x.id)) logById.set(x.id,x);
  if(bc) for(const x of bc.log||[]) if(!logById.has(x.id)) logById.set(x.id,x);
  let log=[...logById.values()].sort((x,y)=>Date.parse(x.at)-Date.parse(y.at));
  if(log.length>MAX_COIN_LOG) log=log.slice(-MAX_COIN_LOG);

  /* balance: base plus every log entry that is new on either side */
  let balance;
  if(bc){
    balance=bc.balance||0;
    const baseIds=new Set((bc.log||[]).map(x=>x.id));
    for(const x of lc.log||[]) if(!baseIds.has(x.id)) balance+=Number(x.amount)||0;
    for(const x of rc.log||[]) if(!baseIds.has(x.id)) balance+=Number(x.amount)||0;
  }else{
    balance=rc.balance||0;
    const remoteIds=new Set((rc.log||[]).map(x=>x.id));
    for(const x of lc.log||[]) if(!remoteIds.has(x.id)) balance+=Number(x.amount)||0;
  }
  balance=clamp(Math.round(balance),0,MAX_COIN_BALANCE);

  const raw={format:FORMAT,version:VERSION,title,rows:r.rows,cols:r.cols,swapped:r.swapped,flipX,flipY,axisY,axisX,
    rowLabels,colLabels,cellNames,tasks,archive,labels,coins:{enabled,balance,rewards,log},savedAt:isoNow()};
  return {state:validateState(raw),conflicts};
}

/* ---------- Google Drive: auth, REST and saving ---------- */
function driveAvailable(){return GDRIVE_VISIBLE;}
function gisLoaded(){return !!(window.google&&window.google.accounts&&window.google.accounts.oauth2);}
/* lazily load the Google Identity Services client; cached promise */
function loadGis(){
  if(gisPromise) return gisPromise;
  gisPromise=new Promise((resolve,reject)=>{
    if(gisLoaded()) return resolve();
    const s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client'; s.async=true; s.defer=true;
    s.onload=()=>resolve();
    s.onerror=()=>{gisPromise=null;reject(new Error('gis'));};
    document.head.append(s);
  });
  return gisPromise;
}
/* the access token (scope drive.file, valid about 1 h) is kept in this browser so a reload continues without a click */
const GDRIVE_TOKEN_KEY='em-gdrive-token';
function storeGdriveToken(){try{if(gdriveToken)localStorage.setItem(GDRIVE_TOKEN_KEY,JSON.stringify({t:gdriveToken,exp:gdriveTokenExp}));else localStorage.removeItem(GDRIVE_TOKEN_KEY);}catch(e){}}
function loadGdriveToken(){try{const v=JSON.parse(localStorage.getItem(GDRIVE_TOKEN_KEY)||'null');if(v&&typeof v.t==='string'&&Number(v.exp)>Date.now()){gdriveToken=v.t;gdriveTokenExp=Number(v.exp);}}catch(e){}}
function clearGdriveToken(){gdriveToken=null;gdriveTokenExp=0;storeGdriveToken();}
const GDRIVE_REFRESH_KEY='em-gdrive-refresh';
function gdriveRefreshToken(){try{return GDRIVE_TOKEN_URL?localStorage.getItem(GDRIVE_REFRESH_KEY):null;}catch(e){return null;}}
function setGdriveRefreshToken(v){try{if(v)localStorage.setItem(GDRIVE_REFRESH_KEY,v);else localStorage.removeItem(GDRIVE_REFRESH_KEY);}catch(e){}}
/* signed in for good: a valid token now, or a lasting connection that renews itself without a click */
function hasDriveAuth(){return validGdriveToken()||!!gdriveRefreshToken();}
function acceptGdriveToken(d){
  gdriveToken=d.access_token;
  gdriveTokenExp=Date.now()+(Number(d.expires_in)||3600)*1000-60000;
  storeGdriveToken();
  if(d.refresh_token) setGdriveRefreshToken(d.refresh_token);
}
async function tokenHelper(path,body){
  let res;
  try{ res=await fetch(GDRIVE_TOKEN_URL.replace(/\/$/,'')+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
  catch(e){ const err=new Error('network'); err.status=0; throw err; }
  let d={}; try{ d=await res.json(); }catch(e){}
  if(!res.ok||!d.access_token){ const err=new Error(d.error||'auth'); err.status=res.status>=500?0:401; err.code=d.error; throw err; }
  return d;
}
let gdriveRefreshing=null;
function refreshGdriveToken(){
  if(gdriveRefreshing) return gdriveRefreshing;
  const rt=gdriveRefreshToken();
  if(!rt) return Promise.reject(gdriveAuthError());
  gdriveRefreshing=tokenHelper('/refresh',{refresh_token:rt})
    .then(d=>{acceptGdriveToken(d);return gdriveToken;})
    .catch(e=>{ if(e.code==='invalid_grant') setGdriveRefreshToken(null); throw e.status===0?e:gdriveAuthError(); })
    .finally(()=>{gdriveRefreshing=null;});
  return gdriveRefreshing;
}
function validGdriveToken(){return !!(gdriveToken&&Date.now()<gdriveTokenExp);}
/* a non-interactive auth failure has status 401 like an expired token */
function gdriveAuthError(){const e=new Error('auth');e.status=401;return e;}
async function getToken(interactive){
  if(validGdriveToken()) return gdriveToken;
  if(gdriveRefreshToken()){
    try{ return await refreshGdriveToken(); }
    catch(e){ if(e.status===0||!interactive) throw e; }   // offline: keep the connection; revoked: sign in again below
  }
  if(!interactive) throw gdriveAuthError();
  if(!gisLoaded()) await loadGis();
  if(!gisLoaded()) throw new Error('gis');
  if(GDRIVE_TOKEN_URL){
    // code flow: Google returns a one-time code, the helper exchanges it for a lasting connection
    const code=await new Promise((resolve,reject)=>{
      try{
        google.accounts.oauth2.initCodeClient({
          client_id:GDRIVE_CLIENT_ID, scope:GDRIVE_SCOPE, ux_mode:'popup',
          callback:resp=>resp&&resp.code?resolve(resp.code):reject(new Error('auth')),
          error_callback:()=>reject(new Error('auth'))
        }).requestCode();
      }catch(e){reject(e);}
    });
    acceptGdriveToken(await tokenHelper('/token',{code}));
    return gdriveToken;
  }
  if(!gdriveTokenClient){
    gdriveTokenClient=google.accounts.oauth2.initTokenClient({
      client_id:GDRIVE_CLIENT_ID, scope:GDRIVE_SCOPE,
      callback:resp=>{
        const p=gdrivePending; gdrivePending=null;
        if(!p) return;
        if(resp&&resp.access_token){
          gdriveToken=resp.access_token;
          const secs=Number(resp.expires_in)||3600;
          gdriveTokenExp=Date.now()+secs*1000-60000;
          storeGdriveToken();
          p.resolve(gdriveToken);
        }else p.reject(new Error('auth'));
      }
    });
  }
  return await new Promise((resolve,reject)=>{
    gdrivePending={resolve,reject};
    try{
      gdriveTokenClient.requestAccessToken({prompt:gdriveFirstTime?'consent':''});
      gdriveFirstTime=false;
    }catch(e){gdrivePending=null;reject(e);}
  });
}
function loadDriveConn(){
  try{
    const raw=localStorage.getItem(GDRIVE_KEY);
    if(!raw) return null;
    const v=JSON.parse(raw);
    if(v&&typeof v.fileId==='string'&&v.fileId) return {fileId:v.fileId,name:String(v.name||GDRIVE_FILE_NAME),version:String(v.version||'')};
  }catch(e){}
  return null;
}

async function driveFetch(url,opts={}){
  const token=await getToken(false);
  let res;
  try{
    res=await fetch(url,{...opts,headers:Object.assign({},opts.headers||{},{Authorization:'Bearer '+token})});
  }catch(e){
    const err=new Error('network'); err.status=0; throw err;
  }
  if(res.status===401){
    clearGdriveToken();
    if(gdriveRefreshToken()&&!opts.__retried) return driveFetch(url,{...opts,__retried:true});   // renew once without a click
    throw gdriveAuthError();
  }
  if(!res.ok){const err=new Error('drive '+res.status);err.status=res.status;throw err;}
  return res;
}
